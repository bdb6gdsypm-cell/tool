<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>收款页</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #f5f7fa; color: #1f2937;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px;
  }
  .logo {
    width: 72px; height: 72px; border-radius: 16px; background: #e8effc;
    display: flex; align-items: center; justify-content: center; font-size: 34px; color: #407bdd;
    margin-bottom: 18px;
  }
  .title { font-size: 17px; font-weight: 600; margin-bottom: 8px; text-align: center; }
  .desc { font-size: 13px; color: #6b7280; line-height: 1.7; text-align: center; max-width: 320px; }
  .btn {
    margin-top: 20px; display: none; padding: 12px 30px; border-radius: 8px;
    background: #407bdd; color: #fff; font-size: 15px; text-decoration: none; border: 0;
    font-family: inherit;
  }
  .btn.show { display: inline-block; }
  .btn-plain {
    margin-top: 12px; display: none; padding: 9px 22px; border-radius: 8px;
    background: #fff; color: #407bdd; border: 1px solid #c8d7f2; font-size: 13px;
    font-family: inherit;
  }
  .btn-plain.show { display: inline-block; }
  .qrwrap { margin-top: 18px; display: none; flex-direction: column; align-items: center; }
  .qrwrap.show { display: flex; }
  .qrwrap img { width: 180px; height: 180px; background: #fff; padding: 8px; border-radius: 10px; }
  .qrwrap span { margin-top: 8px; font-size: 12px; color: #6b7280; }
  .tip { margin-top: 14px; font-size: 12px; color: #9ca3af; line-height: 1.7; text-align: center; max-width: 320px; display: none; }
  .tip.show { display: block; }

  .mask {
    position: fixed; inset: 0; background: rgba(245, 247, 250, .97);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; z-index: 99;
  }
  .mask.show { display: flex; }
  .mask img { width: 240px; height: 240px; background: #fff; padding: 12px; border-radius: 12px; }
  .mask p { margin: 16px 0 0; font-size: 15px; font-weight: 600; color: #1f2937; }
  .mask small { margin-top: 8px; font-size: 12px; color: #6b7280; line-height: 1.7; text-align: center; max-width: 300px; }
  .mask button {
    margin-top: 16px; padding: 10px 26px; border-radius: 8px; border: 1px solid #c8d7f2;
    background: #fff; color: #407bdd; font-size: 13px; font-family: inherit;
  }
</style>
</head>
<body>
  <div class="logo">￥</div>
  <div class="title" id="title">收款页</div>
  <div class="desc" id="desc">正在准备收款页…</div>
  <a class="btn" id="open" href="#">打开收款页</a>
  <button class="btn-plain" id="copy" type="button">复制收款链接</button>
  <div class="qrwrap" id="qrwrap">
    <div id="qrbox"></div>
    <span id="qrtxt">长按二维码识别打开</span>
  </div>
  <div class="tip" id="tip">若点击后没有反应，说明当前应用拦截了外部跳转，可复制链接后在对应 App 内打开。</div>

  <div class="mask" id="mask">
    <img id="maskimg" alt="收款码">
    <p id="masktitle">长按上方二维码识别打开</p>
    <small id="masksub">长按识别这一步即可直接打开收款页</small>
    <button type="button" id="maskclose">打开收款页</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
(function () {
  var titleEl = document.getElementById('title');
  var descEl  = document.getElementById('desc');
  var openBtn = document.getElementById('open');
  var copyBtn = document.getElementById('copy');
  var tipEl   = document.getElementById('tip');
  var maskEl  = document.getElementById('mask');
  var maskImg = document.getElementById('maskimg');
  var maskBtn = document.getElementById('maskclose');

  function getParam(name) {
    var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }

  var wx  = getParam('wx')  || getParam('wechat');
  var ali = getParam('ali') || getParam('alipay');

  if (!wx && !ali) {
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) {
      var p = kv.split('=');
      if (p[0] === 'wx' && !wx) wx = decodeURIComponent(p[1] || '');
      if (p[0] === 'ali' && !ali) ali = decodeURIComponent(p[1] || '');
    });
  }

  var ua = navigator.userAgent || '';
  var isWeChat = /MicroMessenger/i.test(ua);
  var isAlipay = /AlipayClient|AlipayDefined|AliApp/i.test(ua);

  var target = isAlipay ? (ali || wx) : (wx || ali);
  var appName = isAlipay ? '支付宝' : '微信';

  if (!target) {
    titleEl.textContent = '链接不完整';
    descEl.textContent = '缺少收款码参数（wx / ali），请重新扫描聚合收款二维码。';
    return;
  }
  if (!/^(https?:|wxp:|weixin:|alipays:|alipay:)/i.test(target)) {
    titleEl.textContent = '链接无法打开';
    descEl.textContent = '收款码链接格式不正确，请确认后重新生成二维码。';
    return;
  }

  // ---------- 兜底二维码（微信内长按识别可直接打开收款页） ----------
  var qrDataUrl = '';
  function buildQR(cb) {
    var box = document.getElementById('qrbox');
    if (!window.QRCode || !box) { cb(''); return; }
    try {
      new window.QRCode(box, { text: target, width: 240, height: 240, correctLevel: window.QRCode.CorrectLevel.M });
    } catch (e) { cb(''); return; }
    setTimeout(function () {
      var cv = box.querySelector('canvas');
      if (!cv) { cb(''); return; }
      // 转成 <img>，微信里长按图片才能「识别二维码」
      var img = new Image();
      img.src = cv.toDataURL('image/png');
      img.style.cssText = 'width:180px;height:180px;background:#fff;padding:8px;border-radius:10px';
      box.innerHTML = '';
      box.appendChild(img);
      qrDataUrl = img.src;
      document.getElementById('qrwrap').classList.add('show');
      document.getElementById('qrtxt').textContent = isWeChat ? '长按二维码识别，或用微信扫一扫' : '长按二维码识别打开';
      cb(img.src);
    }, 120);
  }

  titleEl.textContent = '打开' + appName + '收款页';
  descEl.textContent = '正在自动打开' + appName + '收款页…';
  openBtn.textContent = '打开' + appName + '收款页';
  openBtn.href = target;
  openBtn.classList.add('show');
  copyBtn.classList.add('show');

  function markStuck() { tipEl.classList.add('show'); }

  var isHttp = /^https?:/i.test(target);

  function showMask() {
    maskEl.classList.add('show');
    document.getElementById('masktitle').textContent = '长按上方二维码识别打开' + appName + '收款页';
    document.getElementById('masksub').textContent = isWeChat
      ? '微信不允许网页自动跳转收款码，长按识别即可直接打开'
      : '支付宝不允许网页自动跳转收款码，长按识别即可直接打开';
    maskBtn.textContent = '打开' + appName + '收款页';
    if (!maskImg.getAttribute('src') && qrDataUrl) maskImg.src = qrDataUrl;
  }

  // 按顺序尝试多种跳转方式，全部失败则自动弹出长按识别遮罩
  function runAttempts(list) {
    var i = 0;
    function next() {
      if (document.hidden) return;      // 页面已被切走，跳转成功
      if (i >= list.length) { showMask(); return; }
      var url = list[i];
      i++;
      try { location.href = url; } catch (e) {}
      setTimeout(next, 1000);
    }
    next();
  }

  function attemptJump() {
    var list = [];
    if (isHttp) {
      // http(s) 目标：直接顶层跳转最可靠，支付宝内再补一次 startapp 包装
      list.push(target);
      if (isAlipay) {
        list.push('alipays://platformapi/startapp?appId=20000067&url=' + encodeURIComponent(target));
      }
    } else {
      // scheme 目标（wxp:// / alipays://）：两个 App 都会拦自动跳，只能靠长按识别
      list.push(target);
    }
    runAttempts(list);
  }

  maskBtn.addEventListener('click', function () {
    maskEl.classList.remove('show');
    try { location.href = target; } catch (e) {}
    setTimeout(function () { if (!document.hidden) markStuck(); }, 1200);
  });

  openBtn.addEventListener('click', function (e) {
    e.preventDefault();
    try { location.href = target; } catch (err) {}
    setTimeout(function () { if (!document.hidden) showMask(); }, 1500);
  });

  copyBtn.addEventListener('click', function () {
    var done = function () {
      copyBtn.textContent = '已复制';
      setTimeout(function () { copyBtn.textContent = '复制收款链接'; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(target).then(done, function () { fallbackCopy(target, done); });
    } else {
      fallbackCopy(target, done);
    }
  });

  function fallbackCopy(text, cb) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); cb(); } catch (e) {}
    document.body.removeChild(ta);
  }

  // http(s) 目标先立刻跳一次，不等二维码渲染完成
  if (isHttp) { try { location.href = target; } catch (e) {} }

  buildQR(function (dataUrl) {
    maskImg.src = dataUrl || '';
    setTimeout(function () { attemptJump(); }, 200);
  });
})();
</script>
</body>
</html>
