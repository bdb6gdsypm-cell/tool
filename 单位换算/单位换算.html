<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单位换算器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{
background: linear-gradient(90deg, #b87eff, #7b42e8);
padding: max(8px, 2vw);
min-height:100vh;
display:flex;
align-items:flex-start;
justify-content:center;
}
.wrap{
width: min(100%, 1100px);
background:#ffffff;
border-radius:18px;
overflow:hidden;
box-shadow:0 2px 12px rgba(0,80,200,0.08);
position:relative;
}
/* 返回按钮：圆形、左上角定位 */
.back-btn{
position:absolute;
top: max(12px, 1.2vw);
left: max(12px, 1.2vw);
width: clamp(32px, 6vw, 36px);
height: clamp(32px, 6vw, 36px);
border-radius:50%;
background:#edf4ff;
color:#3478e8;
border:none;
font-size: clamp(16px, 4vw, 20px);
cursor:pointer;
z-index:10;
display:flex;
align-items:center;
justify-content:center;
}
.back-btn:hover{
background:#dbeaff;
}
.head-title{
padding: clamp(16px, 3vw, 20px) clamp(16px, 3vw, 24px);
font-size: clamp(20px, 5vw, 28px);
color:#222;
font-weight:600;
border-bottom:1px solid #edf2fa;
padding-left: clamp(56px, 12vw, 70px);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.tab-wrap{
display:flex;
align-items:center;
border-bottom:1px solid #edf2fa;
position:relative;
}
.tab-viewport{
flex:1;
overflow:hidden;
}
.tabs{
display:flex;
gap:4px;
white-space:nowrap;
transition: transform 0.25s ease-out;
}
.tabs>div{
padding: clamp(10px, 2vw, 14px) clamp(8px, 2vw, 12px);
font-size: clamp(13px, 3vw, 16px);
color:#666;
cursor:pointer;
white-space:nowrap;
border-bottom:2px solid transparent
}
.tabs>div.active{
color:#3478e8;
border-bottom-color:#3478e8;
font-weight:500
}
.tab-arrow-group{
display:flex;
gap:6px;
padding:0 12px;
flex-shrink:0;
}
.tab-arrow{
width:32px;
height:32px;
border-radius:50%;
border:none;
background:#edf4ff;
color:#3478e8;
cursor:pointer;
font-size:16px;
display:flex;
align-items:center;
justify-content:center;
}
.tab-arrow:hover:not(:disabled){
background:#dbeaff;
}
.tab-arrow:disabled{
opacity:0.4;
cursor:not-allowed;
}
.swap-row{
display:flex;
align-items:center;
gap: clamp(8px, 2vw, 12px);
padding: clamp(16px, 3vw, 24px);
flex-wrap:wrap;
}
.input-item{
flex:1;
display:flex;
border:1px solid #dde4f0;
border-radius:12px;
overflow:hidden;
background:#f8fafc;
min-width: 0;
}
.swap-btn{
width: clamp(34px, 7vw, 40px);
height: clamp(34px, 7vw, 40px);
border-radius:50%;
background:#edf4ff;
color:#3478e8;
border:none;
font-size: clamp(16px, 4vw, 20px);
cursor:pointer;
flex-shrink:0
}
.num-input{
flex:1;
border:none;
outline:none;
padding: clamp(10px, 2vw, 14px) clamp(12px, 2vw, 16px);
font-size: clamp(16px, 4vw, 20px);
background:transparent;
min-width: 60px;
}
.unit-select{
flex: 0 0 auto;
border:none;
border-left:1px solid #dde4f0;
padding:0 clamp(8px, 2vw, 12px);
font-size: clamp(13px, 3vw, 16px);
background:transparent;
min-width: 84px;
outline:none;
}
.all-result{
padding:0 clamp(16px, 3vw, 24px) clamp(16px, 3vw, 24px);
display:grid;
grid-template-columns:repeat(3,1fr);
gap:0;
}
.result-item{
font-size: clamp(12px, 3vw, 15px);
padding: clamp(6px, 1.5vw, 8px) clamp(4px, 1vw, 6px);
}
.result-item .num{
color:#000000;
}
.result-item .unit{
color:#888888;
}
.result-item:nth-child(6n+1),
.result-item:nth-child(6n+2),
.result-item:nth-child(6n+3){
background:#ffffff;
}
.result-item:nth-child(6n+4),
.result-item:nth-child(6n+5),
.result-item:nth-child(6n+6){
background:#f5f7fa;
}

@media(max-width:768px){
.all-result{
grid-template-columns:repeat(2,1fr)
  }
.result-item:nth-child(4n+1),
.result-item:nth-child(4n+2){
background:#ffffff;
  }
.result-item:nth-child(4n+3),
.result-item:nth-child(4n+4){
background:#f5f7fa;
  }
.input-item{
flex: 1 1 calc(50% - clamp(8px,2vw,12px));
}
}

@media(max-width:480px){
.all-result{
grid-template-columns:1fr
  }
.result-item:nth-child(odd){
background:#ffffff;
  }
.result-item:nth-child(even){
background:#f5f7fa;
  }
.swap-row{
flex-direction:column;
align-items:stretch;
gap: 12px;
}
/* 输入框占满整行 */
.input-item{
flex: 1 1 100%;
width:100%;
}
/* 交换按钮居中单独一行 */
.swap-btn{
align-self:center;
transform:rotate(90deg);
}
/* 删掉小屏箭头纵向样式，箭头组保持横向 */
}
</style>
</head>
<body>
<div class="wrap">
<button class="back-btn" onclick="location.href='../首页/首页.html'">←</button>
<div class="head-title" id="mainTitle">1千米=1米</div>

</div>
<div class="tab-arrow-group">
<button class="tab-arrow" id="tabLeftBtn">&lt;</button>

</div>

<div class="swap-row">

<div class="all-result" id="resultGrid"></div>

let currentType = "length";
const leftValDom = document.getElementById("leftVal");
const rightValDom = document.getElementById("rightVal");
const leftUnitDom = document.getElementById("leftUnit");
const rightUnitDom = document.getElementById("rightUnit");
const titleDom = document.getElementById("mainTitle");
const gridDom = document.getElementById("resultGrid");
const swapBtn = document.getElementById("swapBtn");

const tabInner = document.getElementById('tabInner');
const tabLeftBtn = document.getElementById('tabLeftBtn');
const tabRightBtn = document.getElementById('tabRightBtn');
let tabOffset = 0;
const scrollStep = 130;

function updateTabArrowState(){
const viewWidth = tabInner.parentElement.clientWidth;
const contentWidth = tabInner.scrollWidth;
const maxOffset = -(contentWidth - viewWidth);
tabLeftBtn.disabled = tabOffset >= 0;
tabRightBtn.disabled = tabOffset <= maxOffset;
}

tabRightBtn.onclick = () => {
tabOffset -= scrollStep;
const viewWidth = tabInner.parentElement.clientWidth;
const contentWidth = tabInner.scrollWidth;
const maxOffset = -(contentWidth - viewWidth);
if(tabOffset < maxOffset) tabOffset = maxOffset;
tabInner.style.transform = `translateX(${tabOffset}px)`;
updateTabArrowState();
};

tabLeftBtn.onclick = () => {
tabOffset += scrollStep;
if(tabOffset > 0) tabOffset = 0;
tabInner.style.transform = `translateX(${tabOffset}px)`;
updateTabArrowState();
};

function formatNum(n){
if(isNaN(n)) return "";
const abs = Math.abs(n);
if(abs === 0) return "0";
if(abs < 0.00001 || abs >= 10000000){
let str = n.toExponential(2);
let parts = str.split("e");
let numPart = parseFloat(parts[0]);
let numStr = Number.isInteger(numPart) ? numPart.toString() : numPart.toFixed(2);
let expText = parts[1].startsWith('+') ? parts[1].slice(1) : parts[1];
return `${numStr}×10<sup>${expText}</sup>`;
}
if(abs < 1){
let exp = Math.floor(Math.log10(abs));
let fix = -(exp) + 2;
return n.toFixed(fix);
}
if(Number.isInteger(n)){
return n.toString();
}else{
return n.toFixed(2);
}
}





function tempConvert(val, fromIdx, toIdx){
const list = unitData.temperature.list;
let c; // 统一先转成摄氏度作为中间值
if(list[fromIdx].name === "摄氏度(℃)"){
    c = val;
}else if(list[fromIdx].name === "华氏度(℉)"){
    c = (val - 32) * 5 / 9;
}else if(list[fromIdx].name === "开氏度(K)"){
    c = val - 273.15;
}else if(list[fromIdx].name === "兰氏度(°R)"){
    c = (val * 5 / 9) - 273.15;
}else if(list[fromIdx].name === "列氏度(°Re)"){
    c = val * 5 / 4;
}

let out;
if(list[toIdx].name === "摄氏度(℃)"){
    out = c;
}else if(list[toIdx].name === "华氏度(℉)"){
    out = c * 9 / 5 + 32;
}else if(list[toIdx].name === "开氏度(K)"){
    out = c + 273.15;
}else if(list[toIdx].name === "兰氏度(°R)"){
    out = (c + 273.15) * 9 / 5;
}else if(list[toIdx].name === "列氏度(°Re)"){
    out = c * 4 / 5;
}
return out;
}


function renderUnitSelect(){
const item = unitData[currentType];
const arr = item.list;
leftUnitDom.innerHTML = "";
rightUnitDom.innerHTML = "";
arr.forEach((u,idx)=>{
const o1 = new Option(u.name, idx);
const o2 = new Option(u.name, idx);
leftUnitDom.appendChild(o1);
rightUnitDom.appendChild(o2);
  })

  if(currentType === 'mass'){
  // 公斤(kg)在上面数组索引28，克(g)索引0
  leftUnitDom.value = 0;
  rightUnitDom.value = 1;
}else{
  leftUnitDom.value = 0;
  rightUnitDom.value = 1;
}

leftValDom.value = "1";
calc();
}

function calc(){
const item = unitData[currentType];
const arr = item.list;
const leftIdx = Number(leftUnitDom.value);
const rightIdx = Number(rightUnitDom.value);
const vLeft = Number(leftValDom.value);
if(isNaN(vLeft)) return;
let vRight, baseVal;
if(item.isTemp){
vRight = tempConvert(vLeft, leftIdx, rightIdx);
baseVal = tempConvert(vLeft, leftIdx, 0);
}else{
baseVal = vLeft * arr[leftIdx].rate;
vRight = baseVal / arr[rightIdx].rate;
}
let leftFmt = formatNum(vLeft);
let rightFmt = formatNum(vRight);
titleDom.innerHTML = `${leftFmt}${arr[leftIdx].name}=${rightFmt}${arr[rightIdx].name}`;
rightValDom.value = stripHtml(rightFmt);
const hideName = arr[leftIdx].name;
gridDom.innerHTML = "";
arr.forEach((u,idx)=>{
if(u.name === hideName) return;
let resVal;
if(item.isTemp){
resVal = tempConvert(vLeft, leftIdx, idx);
}else{
resVal = baseVal / u.rate;
}
const fmt = formatNum(resVal);
const div = document.createElement("div");
div.className = "result-item";
div.innerHTML = `<span class="num">${fmt}</span> <span class="unit">${u.name}</span>`;
gridDom.appendChild(div);
})
}

function calcFromRight(){
const item = unitData[currentType];
const arr = item.list;
const leftIdx = Number(leftUnitDom.value);
const rightIdx = Number(rightUnitDom.value);
const vRight = Number(rightValDom.value);
if(isNaN(vRight)) return;
let vLeft, baseVal;
if(item.isTemp){
vLeft = tempConvert(vRight, rightIdx, leftIdx);
baseVal = tempConvert(vRight, rightIdx, 0);
}else{
baseVal = vRight * arr[rightIdx].rate;
vLeft = baseVal / arr[leftIdx].rate;
}
let leftFmt = formatNum(vLeft);
let rightFmt = formatNum(vRight);
titleDom.innerHTML = `${leftFmt}${arr[leftIdx].name}=${rightFmt}${arr[rightIdx].name}`;
leftValDom.value = stripHtml(leftFmt);
const hideName = arr[leftIdx].name;
gridDom.innerHTML = "";
arr.forEach((u,idx)=>{
if(u.name === hideName) return;
let resVal;
if(item.isTemp){
resVal = tempConvert(vRight, rightIdx, idx);
}else{
resVal = baseVal / u.rate;
}
const fmt = formatNum(resVal);
const div = document.createElement("div");
div.className = "result-item";
div.innerHTML = `<span class="num">${fmt}</span> <span class="unit">${u.name}</span>`;
gridDom.appendChild(div);
})
}
function stripHtml(str){
return str.replace(/<[^>]+>/g,"");
}

swapBtn.onclick = ()=>{
const tempU = leftUnitDom.value;
leftUnitDom.value = rightUnitDom.value;
rightUnitDom.value = tempU;
calc();
}

})
