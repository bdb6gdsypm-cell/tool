<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>进制转换器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23242b35'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='17' fill='%23f7f5ef' text-anchor='middle'%3E10%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --paper:#f8f6f1;
    --card:#fffdf9;
    --ink:#20262e;
    --muted:#737a85;
    --line:#e3ded3;
    --blue:#5b74e8;
    --blue-ink:#465cc9;
    --green:#5fc48a;
    --green-ink:#3aa066;
    --dark:#242b35;
    --radius:8px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:clamp(12px,3vw,40px);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
  }
  .page-wrap{width:min(1400px,100%);display:flex;flex-direction:column;align-items:flex-start}
  .back-btn{
    width:44px;height:44px;border-radius:50%;
    background:#fffdf9;border:1px solid var(--line);
    display:inline-flex;align-items:center;justify-content:center;
    color:var(--ink);text-decoration:none;
    margin-bottom:12px;
    box-shadow:0 1px 3px rgba(32,38,46,.06);
    transition:background-color .18s ease,border-color .18s ease,transform .18s ease;
  }
  .back-btn svg{width:20px;height:20px}
  .back-btn:hover{background:#fff;border-color:#c8c2b5;transform:translateX(-2px)}
  .back-btn:focus-visible{outline:2px solid var(--dark);outline-offset:2px}
  .shell{
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    display:grid;
    grid-template-columns:1fr;
    overflow:hidden;
  }

  /* 两栏：窄屏单列，桌面左右分栏 */
  .col{padding:clamp(16px,3vw,32px) clamp(14px,2.6vw,34px)}
  .col--in{border-bottom:1px solid var(--line)}
  @media (min-width:940px){
    .shell{grid-template-columns:1fr 1fr}
    .col--in{border-bottom:0;border-right:1px solid var(--line)}
  }

  .block-head{
    display:flex;align-items:center;gap:10px;
    padding-bottom:14px;margin-bottom:22px;
    border-bottom:1px solid var(--line);
  }
  .block-head svg{width:22px;height:22px;color:var(--ink);flex:none;opacity:.85}
  .block-head h1,.block-head h2{
    font-size:clamp(19px,2.2vw,23px);
    font-weight:600;letter-spacing:.5px;margin:0;
  }
  .sub-head{
    display:flex;align-items:center;gap:9px;
    margin:26px 0 16px;
    font-size:clamp(15px,1.7vw,18px);font-weight:600;
  }
  .sub-head svg{width:20px;height:20px;opacity:.8}
  .field-label{font-size:15px;color:var(--muted);margin:0 0 12px}
  .field-label b{font-weight:500;color:var(--muted)}

  /* 进制按钮 */
  .base-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  @media (min-width:520px){.base-row{grid-template-columns:repeat(5,minmax(0,1fr))}}
  .base-btn{
    appearance:none;background:var(--card);
    border:1px solid #d9d4c9;border-radius:var(--radius);
    color:var(--ink);font:inherit;
    min-height:78px;padding:10px 6px 9px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    cursor:pointer;
    transition:background-color .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease;
  }
  .base-btn svg{width:24px;height:24px;opacity:.72}
  .base-btn span{font-size:16px;letter-spacing:.3px}
  .base-btn:hover{border-color:#b8b1a2}
  .base-btn:focus-visible{outline:2px solid var(--dark);outline-offset:2px}
  .base-btn.is-src{
    background:var(--blue);border-color:var(--blue);color:#fff;
    box-shadow:0 4px 14px rgba(91,116,232,.28);
  }
  .base-btn.is-src svg{opacity:.9}
  .base-btn.is-dst{
    background:var(--green);border-color:var(--green);color:#fff;
    box-shadow:0 4px 14px rgba(95,196,138,.28);
  }
  .base-btn.is-dst svg{opacity:.95}
  .base-btn.is-more{position:relative;gap:0;padding:0 8px 7px;justify-content:flex-end;grid-column:span 2;background:#faf8f2}
  @media (min-width:520px){.base-btn.is-more{grid-column:auto}}
  .base-btn.is-more .more-label{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:16px;letter-spacing:.3px;padding-bottom:6px}
  .base-btn.is-more .more-hint{font-size:11px;line-height:1.4;color:var(--muted);text-align:center;margin-bottom:0}
  .base-btn.is-more.is-src{
    background:var(--blue);border-color:var(--blue);color:#fff;
    box-shadow:0 4px 14px rgba(91,116,232,.28);
  }
  .base-btn.is-more.is-dst{
    background:var(--green);border-color:var(--green);color:#fff;
    box-shadow:0 4px 14px rgba(95,196,138,.28);
  }
  .base-btn.is-more.is-src .more-hint,.base-btn.is-more.is-dst .more-hint{color:rgba(255,255,255,.85)}
  .custom-link{
    display:block;margin:12px 0 0 auto;
    background:none;border:0;padding:4px 2px;
    font:inherit;font-size:14px;color:var(--muted);
    text-decoration:underline;text-underline-offset:3px;cursor:pointer;
  }
  .custom-link:hover{color:var(--ink)}
  .custom-link:focus-visible{outline:2px solid var(--dark);outline-offset:2px;border-radius:4px}
  .custom-tag{margin-left:auto;font-size:14px;color:var(--blue-ink)}

  /* 输入框 */
  .input-wrap{position:relative}
  textarea#numInput{
    width:100%;min-height:140px;resize:vertical;
    background:var(--dark);color:#f2f0ea;
    border:1px solid var(--dark);border-radius:var(--radius);
    padding:18px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:clamp(18px,2.4vw,24px);
    line-height:1.5;letter-spacing:.5px;outline:none;
    transition:box-shadow .18s ease,border-color .18s ease;
  }
  textarea#numInput::placeholder{color:#7d8590;letter-spacing:1px}
  textarea#numInput:focus{box-shadow:0 0 0 2px rgba(91,116,232,.55);border-color:#4a67d6}
  .input-error{display:none;margin-top:10px;font-size:14px;color:#b4462f}
  .digit-hint{
    margin-top:10px;font-size:13px;color:var(--muted);
    display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  }
  .digit-hint code{
    font-family:ui-monospace,Menlo,monospace;
    background:#f1eee6;border:1px solid var(--line);border-radius:4px;
    padding:1px 5px;color:#4c525c;font-size:12px;
  }

  /* 交换按钮 */
  .swap-row{display:flex;justify-content:center;margin:20px 0 6px}
  .swap-btn{
    width:56px;height:56px;border-radius:50%;
    border:1px solid #ece8df;background:#faf8f2;
    color:var(--blue-ink);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background-color .18s ease,transform .18s ease,box-shadow .18s ease;
  }
  .swap-btn svg{width:26px;height:26px}
  .swap-btn:hover{background:#f2eff1;box-shadow:0 3px 10px rgba(32,38,46,.08)}
  .swap-btn:active{transform:rotate(180deg)}
  .swap-btn:focus-visible{outline:2px solid var(--dark);outline-offset:3px}

  /* 结果区 */
  .result-box{
    position:relative;background:var(--dark);
    border-radius:var(--radius);
    padding:24px 56px 30px;
    min-height:158px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    text-align:center;
  }
  .result-box .cap{font-size:14px;color:#98a0ab;letter-spacing:.5px}
  .result-value{
    margin:0;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:clamp(20px,3vw,30px);
    color:#f2f0ea;letter-spacing:1px;
    word-break:break-all;line-height:1.4;
  }
  .result-value.is-empty{color:#aab1bb;letter-spacing:3px}
  .result-sub{font-size:13px;color:#98a0ab;min-height:0}
  .copy-btn{
    position:absolute;top:12px;right:12px;
    width:32px;height:32px;border-radius:6px;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.06);color:#dfe3e8;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background-color .18s ease;
  }
  .copy-btn svg{width:17px;height:17px}
  .copy-btn:hover{background:rgba(255,255,255,.16)}
  .copy-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}

  /* 详细步骤 */
  .steps-box{
    border:1px solid var(--line);border-radius:var(--radius);
    background:var(--card);min-height:238px;padding:20px;
    display:flex;flex-direction:column;
  }
  .steps-empty{
    margin:auto;text-align:center;color:#8b9098;
    display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 0;
  }
  .steps-empty svg{width:54px;height:54px;opacity:.55}
  .steps-empty p{margin:0;font-size:15px}
  .steps-body{display:none;flex-direction:column;gap:18px}
  .step-group h3{
    margin:0 0 8px;font-size:14px;font-weight:600;
    display:flex;align-items:center;gap:6px;
  }
  .step-group h3 .tag{
    font-size:11px;font-weight:500;color:#fff;background:#9aa1ab;
    padding:2px 6px;border-radius:4px;letter-spacing:.5px;
  }
  .step-lines{
    margin:0;padding:12px 14px;
    border:1px solid #efeadf;border-radius:6px;background:#fbf9f4;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13.5px;line-height:1.85;color:#3d434c;
    overflow-x:auto;white-space:pre;
  }
  .step-lines .rem{color:var(--green-ink)}
  .step-final{
    padding:12px 14px;border-left:3px solid var(--blue);
    background:#f4f2fb;border-radius:0 6px 6px 0;
    font-size:14px;color:#3d434c;word-break:break-all;
    line-height:1.7;
  }
  .step-final b{color:var(--blue-ink)}

  /* 自定义进制弹层 */
  .pop{
    position:fixed;inset:0;background:rgba(26,29,34,.38);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:20;
  }
  .pop.is-open{display:flex}
  .pop-card{
    width:min(380px,100%);background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:22px;
    box-shadow:0 18px 50px rgba(20,24,30,.22);
  }
  .pop-card h3{margin:0 0 6px;font-size:18px;font-weight:600}
  .pop-card p{margin:0 0 16px;font-size:14px;color:var(--muted);line-height:1.6}
  .pop-card input{
    width:100%;height:48px;border:1px solid #d9d4c9;border-radius:8px;
    background:#fff;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);
  }
  .pop-card input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(91,116,232,.25)}
  .pop-err{min-height:20px;margin:8px 0 0!important;font-size:13px;color:#b4462f}
  .pop-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
  .pop-actions button{
    font:inherit;font-size:15px;height:42px;padding:0 20px;border-radius:8px;cursor:pointer;
    border:1px solid #d9d4c9;background:#fff;color:var(--ink);
  }
  .pop-actions .primary{background:var(--dark);border-color:var(--dark);color:#fff}
  .pop-actions button:focus-visible{outline:2px solid var(--dark);outline-offset:2px}

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);
    background:#20262e;color:#f5f2ea;font-size:14px;padding:10px 18px;border-radius:8px;
    opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:30;
  }
  .toast.is-on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:520px){
    .result-box{padding:22px 48px 24px;min-height:140px}
    .block-head{margin-bottom:18px}
  }
</style>
</head>
<body>
<div class="page-wrap">
<a class="back-btn" href="../首页/首页.html" aria-label="返回首页">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
    <path d="M15 5l-7 7 7 7"/>
  </svg>
</a>
<main class="shell">

  <!-- ===== 左栏：输入设置 ===== -->
  <section class="col col--in">
    <div class="block-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16M13 4v16M18 4v16" stroke-width="1.2"/>
      </svg>
      <h1>输入设置</h1>
    </div>

    <p class="field-label"><b>源进制 (FROM)</b></p>
    <div class="base-row" id="fromRow" role="group" aria-label="源进制">
      <button class="base-btn is-src" data-base="2" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <rect x="6" y="4" width="12" height="16" rx="1.6"/><path d="M9 7h2v2H9zM13 7h2v2h-2zM9 11h2v2H9zM13 11h2v2h-2zM9 15h2v2H9zM13 15h2v2h-2z"/>
        </svg>
        <span>2 进制</span>
      </button>
      <button class="base-btn" data-base="8" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 3v9m0 0l8 4.5M12 12L4 16.5" stroke-width="1.1"/>
        </svg>
        <span>8 进制</span>
      </button>
      <button class="base-btn" data-base="10" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M7 9l-3 3 3 3M17 9l3 3-3 3M13 7l-2 10"/>
        </svg>
        <span>10 进制</span>
      </button>
      <button class="base-btn" data-base="16" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M9 8L4 12l5 4M15 8l5 4-5 4"/>
        </svg>
        <span>16 进制</span>
      </button>
      <button class="base-btn is-more" id="fromMoreBtn" type="button" aria-label="选择其他进制类型">
        <span class="more-label">更多</span>
        <span class="more-hint">点击选择其他进制</span>
      </button>
    </div>

    <div style="height:26px"></div>

    <p class="field-label">输入数值</p>
    <div class="input-wrap">
      <textarea id="numInput" spellcheck="false" autocomplete="off" autocapitalize="off"
        placeholder="在此输入数字..."></textarea>
      <p class="input-error" id="inputError"></p>
      <p class="digit-hint" id="digitHint"></p>
    </div>

    <div class="swap-row">
      <button class="swap-btn" id="swapBtn" type="button" aria-label="交换源进制与目标进制">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <path d="M4 8h13l-3-3m3 3l-3 3M20 16H7l3-3m-3 3l3 3"/>
        </svg>
      </button>
    </div>

    <p class="field-label"><b>目标进制 (TO)</b></p>
    <div class="base-row" id="toRow" role="group" aria-label="目标进制">
      <button class="base-btn is-dst" data-base="2" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <rect x="6" y="4" width="12" height="16" rx="1.6"/><path d="M9 7h2v2H9zM13 7h2v2h-2zM9 11h2v2H9zM13 11h2v2h-2zM9 15h2v2H9zM13 15h2v2h-2z"/>
        </svg>
        <span>2 进制</span>
      </button>
      <button class="base-btn" data-base="8" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 3v9m0 0l8 4.5M12 12L4 16.5" stroke-width="1.1"/>
        </svg>
        <span>8 进制</span>
      </button>
      <button class="base-btn" data-base="10" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M7 9l-3 3 3 3M17 9l3 3-3 3M13 7l-2 10"/>
        </svg>
        <span>10 进制</span>
      </button>
      <button class="base-btn" data-base="16" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M9 8L4 12l5 4M15 8l5 4-5 4"/>
        </svg>
        <span>16 进制</span>
      </button>
      <button class="base-btn is-more" id="toMoreBtn" type="button" aria-label="选择其他进制类型">
        <span class="more-label">更多</span>
        <span class="more-hint">点击选择其他进制</span>
      </button>
    </div>
  </section>

  <!-- ===== 右栏：结果与过程 ===== -->
  <section class="col">
    <div class="block-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <path d="M4 6h2M4 12h2M4 18h2M9 6h11M9 12h11M9 18h11" stroke-width="1.6"/>
      </svg>
      <h2>转换结果与过程</h2>
    </div>

    <div class="result-box">
      <button class="copy-btn" id="copyBtn" type="button" aria-label="复制转换结果">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M15 6.5A1.5 1.5 0 0 0 13.5 5H6a1 1 0 0 0-1 1v7.5A1.5 1.5 0 0 0 6.5 15"/>
        </svg>
      </button>
      <span class="cap">转换结果</span>
      <p class="result-value is-empty" id="resultValue">—</p>
      <span class="result-sub" id="resultSub"></span>
    </div>

    <div class="sub-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <path d="M4 7h2M4 12h2M4 17h2M9 7h11M9 12h11M9 17h11" stroke-width="1.6"/>
      </svg>
      详细转换步骤
    </div>

    <div class="steps-box">
      <div class="steps-empty" id="stepsEmpty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="5" y="3" width="14" height="18" rx="2"/><rect x="8" y="6" width="8" height="4" rx="0.8"/>
          <path d="M7.5 13h2.2v2.2H7.5zM12 13h2.2v2.2H12zM7.5 17h2.2v2.2H7.5zM12 17h2.2v2.2H12z"/>
        </svg>
        <p>请输入数字并选择进制以查看详细步骤</p>
      </div>
      <div class="steps-body" id="stepsBody"></div>
    </div>
  </section>
</main>
</div>

<!-- ===== 自定义进制弹层 ===== -->
<div class="pop" id="pop" role="dialog" aria-modal="true" aria-labelledby="popTitle">
  <div class="pop-card">
    <h3 id="popTitle">自定义进制</h3>
    <p>输入 2 到 36 之间的整数。大于 10 的进制使用 a–z 表示 10–35。</p>
    <input id="popInput" type="text" inputmode="numeric" placeholder="例如 3" maxlength="2">
    <p class="pop-err" id="popErr"></p>
    <div class="pop-actions">
      <button type="button" id="popCancel">取消</button>
      <button type="button" id="popOk" class="primary">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var state = { from: 10, to: 2 };
  var DIGITS = '0123456789abcdefghijklmnopqrstuvwxyz';
  var MAX_FRAC = 24;

  var fromRow = document.getElementById('fromRow');
  var toRow = document.getElementById('toRow');
  var input = document.getElementById('numInput');
  var errEl = document.getElementById('inputError');
  var hintEl = document.getElementById('digitHint');
  var resultEl = document.getElementById('resultValue');
  var resultSub = document.getElementById('resultSub');
  var stepsEmpty = document.getElementById('stepsEmpty');
  var stepsBody = document.getElementById('stepsBody');
  var fromMore = document.getElementById('fromMoreBtn');
  var toMore = document.getElementById('toMoreBtn');

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function paintBaseRow(row, current, mode, moreBtn){
    Array.prototype.forEach.call(row.querySelectorAll('.base-btn[data-base]'), function(btn){
      btn.classList.remove('is-src','is-dst');
      if (Number(btn.dataset.base) === current) btn.classList.add(mode);
    });
    moreBtn.classList.remove('is-src','is-dst');
    var label = moreBtn.querySelector('.more-label');
    if ([2,8,10,16].indexOf(current) === -1){
      label.textContent = current + ' 进制';
      moreBtn.classList.add(mode);
    } else {
      label.textContent = '更多';
    }
  }

  function updateRows(){
    paintBaseRow(fromRow, state.from, 'is-src', fromMore);
    paintBaseRow(toRow, state.to, 'is-dst', toMore);
    hintEl.innerHTML = '可用字符：<code>' + esc(DIGITS.slice(0, state.from)) + '</code>';
    convert();
  }

  function parseValue(raw, base){
    var s = String(raw).trim();
    if (!s) return null;
    var neg = false;
    if (s[0] === '-'){ neg = true; s = s.slice(1); }
    else if (s[0] === '+'){ s = s.slice(1); }
    if (!/^[0-9a-zA-Z]*(\.[0-9a-zA-Z]*)?$/.test(s) || s === '.' || s === '')
      return { error: '请输入由数字和字母组成的合法数值' };
    var parts = s.split('.');
    var intStr = parts[0] || '0';
    var fracStr = parts[1] || '';
    for (var i = 0; i < intStr.length; i++){
      var d = DIGITS.indexOf(intStr[i].toLowerCase());
      if (d < 0 || d >= base) return { error: '字符「' + intStr[i] + '」不属于 ' + base + ' 进制' };
    }
    for (var j = 0; j < fracStr.length; j++){
      var f = DIGITS.indexOf(fracStr[j].toLowerCase());
      if (f < 0 || f >= base) return { error: '字符「' + fracStr[j] + '」不属于 ' + base + ' 进制' };
    }
    return { neg: neg, intStr: intStr, fracStr: fracStr };
  }

  function intToBigInt(str, base){
    var big = BigInt(base), acc = 0n;
    for (var i = 0; i < str.length; i++){
      acc = acc * big + BigInt(Math.max(0, DIGITS.indexOf(str[i].toLowerCase())));
    }
    return acc;
  }

  function bigIntToString(n, base){
    if (n === 0n) return '0';
    var big = BigInt(base), out = '';
    while (n > 0n){
      out = DIGITS[Number(n % big)] + out;
      n = n / big;
    }
    return out;
  }

  function convertFraction(num, den, targetBase, maxDigits){
    var digits = [], steps = [], big = BigInt(targetBase), i = 0;
    while (num > 0n && i < maxDigits){
      var scaled = num * big;
      var digit = scaled / den;
      var rem = scaled % den;
      steps.push({ scaled: scaled, digit: Number(digit), rem: rem, den: den });
      digits.push(DIGITS[Number(digit)]);
      num = rem;
      i++;
    }
    return { digits: digits.join(''), steps: steps, exact: num === 0n };
  }

  function convert(){
    var raw = input.value;
    errEl.style.display = 'none';
    if (!raw.trim()){ setEmpty(false); return; }
    var parsed = parseValue(raw, state.from);
    if (!parsed || parsed.error){
      errEl.textContent = parsed && parsed.error ? parsed.error : '请输入合法数值';
      errEl.style.display = 'block';
      setEmpty(true);
      return;
    }

    var intStr = parsed.intStr || '0';
    var intVal = intToBigInt(intStr, state.from);
    var outInt = bigIntToString(intVal, state.to);

    var fracStr = parsed.fracStr;
    var fracNum = 0n, fracDen = 1n;
    if (fracStr){
      fracDen = BigInt(state.from) ** BigInt(fracStr.length);
      fracNum = intToBigInt(fracStr, state.from);
    }
    var fracRes = fracStr ? convertFraction(fracNum, fracDen, state.to, MAX_FRAC) : null;

    var out = outInt;
    if (fracRes && fracRes.digits) out += '.' + fracRes.digits;
    if (parsed.neg && !(intVal === 0n && (!fracRes || !fracRes.digits))) out = '-' + out;

    resultEl.textContent = out;
    resultEl.classList.remove('is-empty');

    var baseName = {2:'二进制',8:'八进制',10:'十进制',16:'十六进制'};
    resultSub.textContent = (baseName[state.to] || state.to + ' 进制') + ' · 源 ' + (baseName[state.from] || state.from + ' 进制');

    renderSteps(parsed, intVal, fracNum, fracDen, fracRes, out);
  }

  function setEmpty(isError){
    resultEl.textContent = '—';
    resultEl.classList.add('is-empty');
    resultSub.textContent = '';
    stepsBody.style.display = 'none';
    stepsBody.innerHTML = '';
    stepsEmpty.style.display = 'flex';
    stepsEmpty.querySelector('p').textContent = isError
      ? '修正输入后即可查看详细步骤'
      : '请输入数字并选择进制以查看详细步骤';
  }

  function intDigitsList(intVal, base){
    var big = BigInt(base), cur = intVal, arr = [];
    if (cur === 0n) return '0';
    while (cur > 0n){ arr.push(DIGITS[Number(cur % big)].toUpperCase()); cur = cur / big; }
    return arr.join(' ');
  }

  function renderSteps(parsed, intVal, fracNum, fracDen, fracRes, out){
    var html = '';

    html += '<div class="step-group"><h3>十进制中间值</h3><div class="step-final">';
    html += '源值 ' + esc((parsed.neg ? '-' : '') + parsed.intStr + (parsed.fracStr ? '.' + parsed.fracStr : '')) +
            '（' + state.from + ' 进制） = ' + (parsed.neg ? '−' : '') + '<b>' + intVal.toString() + '</b>' +
            (parsed.fracStr ? ' + 小数部分' : '') + '（十进制）';
    html += '</div></div>';

    var lines = [], cur = intVal, big = BigInt(state.to), guard = 0;
    if (intVal > 0n){
      while (guard < 300){
        var q = cur / big, r = cur % big;
        lines.push(cur.toString() + ' ÷ ' + state.to + ' = ' + q.toString() + '  余 <span class="rem">' + DIGITS[Number(r)].toUpperCase() + '</span>');
        cur = q;
        guard++;
        if (cur === 0n) break;
      }
      html += '<div class="step-group"><h3>整数部分 · 连续除以 ' + state.to + '<span class="tag">取余数</span></h3>';
      html += '<div class="step-lines">' + lines.join('\n') + '</div></div>';
    }

    if (fracRes && fracRes.steps.length){
      var flines = fracRes.steps.map(function(s){
        return '(' + s.scaled.toString() + '/' + s.den.toString() + ') × ' + state.to +
               ' → 整数位 <span class="rem">' + DIGITS[s.digit].toUpperCase() + '</span>，余 ' +
               s.rem.toString() + '/' + s.den.toString();
      });
      html += '<div class="step-group"><h3>小数部分 · 连续乘以 ' + state.to + '<span class="tag">取整数位</span></h3>';
      html += '<div class="step-lines">' + flines.join('\n') + '</div>';
      if (!fracRes.exact){
        html += '<div class="step-final" style="margin-top:8px;border-left-color:#b8b1a2;background:#faf8f2">小数在该进制下为无限循环，已保留前 ' + MAX_FRAC + ' 位。</div>';
      }
      html += '</div>';
    }

    html += '<div class="step-group"><h3>结果汇总</h3><div class="step-final">';
    html += '整数位（低位 → 高位）：' + esc(intDigitsList(intVal, state.to));
    html += '<br>最终结果：<b>' + esc(out) + '</b>';
    html += '</div></div>';

    stepsBody.innerHTML = html;
    stepsBody.style.display = 'flex';
    stepsEmpty.style.display = 'none';
  }

  fromRow.addEventListener('click', function(e){
    var btn = e.target.closest('.base-btn[data-base]');
    if (!btn) return;
    state.from = Number(btn.dataset.base);
    updateRows();
  });
  toRow.addEventListener('click', function(e){
    var btn = e.target.closest('.base-btn[data-base]');
    if (!btn) return;
    state.to = Number(btn.dataset.base);
    updateRows();
  });

  var pop = document.getElementById('pop');
  var popInput = document.getElementById('popInput');
  var popErr = document.getElementById('popErr');
  var popTarget = 'from';
  var lastFocus = null;

  function openPop(target){
    popTarget = target;
    popErr.textContent = '';
    popInput.value = target === 'from' ? state.from : state.to;
    pop.classList.add('is-open');
    lastFocus = document.activeElement;
    setTimeout(function(){ popInput.focus(); popInput.select(); }, 60);
  }
  function closePop(){
    pop.classList.remove('is-open');
    if (lastFocus) lastFocus.focus();
  }
  fromMore.addEventListener('click', function(){ openPop('from'); });
  toMore.addEventListener('click', function(){ openPop('to'); });
  document.getElementById('popCancel').addEventListener('click', closePop);
  pop.addEventListener('click', function(e){ if (e.target === pop) closePop(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && pop.classList.contains('is-open')) closePop();
  });
  popInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') applyPop(); });
  document.getElementById('popOk').addEventListener('click', applyPop);

  function applyPop(){
    var v = popInput.value.trim();
    if (!/^\d{1,2}$/.test(v) || Number(v) < 2 || Number(v) > 36){
      popErr.textContent = '请输入 2 到 36 之间的整数';
      return;
    }
    var n = Number(v);
    if (popTarget === 'from'){
      if (n === state.to) state.to = (n === 2 ? 10 : 2);
      state.from = n;
    } else {
      if (n === state.from) state.from = (n === 2 ? 10 : 2);
      state.to = n;
    }
    closePop();
    updateRows();
  }

  document.getElementById('swapBtn').addEventListener('click', function(){
    var tmp = state.from; state.from = state.to; state.to = tmp;
    if (input.value.trim() && !resultEl.classList.contains('is-empty')){
      input.value = resultEl.textContent;
    }
    updateRows();
  });

  document.getElementById('copyBtn').addEventListener('click', function(){
    var txt = resultEl.textContent;
    if (!txt || resultEl.classList.contains('is-empty')){ toast('暂无可复制的结果'); return; }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast('已复制结果'); }, fallback);
    } else fallback();
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('已复制结果'); }
      catch (err) { toast('复制失败，请手动选择'); }
      document.body.removeChild(ta);
    }
  });

  var toastTimer;
  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('is-on'); }, 1600);
  }

  input.addEventListener('input', convert);
  updateRows();
})();
</script>
</body>
</html>
