<body class="bg-lightBg min-h-screen p-4 md:p-8 flex justify-center items-start">
<div class="w-full max-w-4xl">

<div class="grid grid-cols-1 md:grid-cols-[1fr_1fr_auto_1fr] gap-4 md:gap-6 items-center justify-center mb-6">
<div class="w-full">
<label id="labelAmount" class="block text-stone-700 mb-2 font-medium">金额</label>
<input id="amount" type="number" value="1" step="any" class="input-border w-full px-4 py-3 text-lg" />
</div>

<!-- 【从币种】自定义下拉 -->
<div class="w-full">
<label id="labelFrom" class="block text-stone-700 mb-2 font-medium">从</label>

<span class="curr-label">人民币（在岸）(CNY)</span>
<i class="fa fa-chevron-down text-stone-400"></i>
</div>
<div class="dropdown-panel hidden">
<input type="text" class="curr-search w-full px-4 py-2 border-b border-stone-200 focus:outline-none" placeholder="搜索币种代码/名称..." />
<div class="option-list max-h-64 overflow-y-auto"></div>
</div>
<input type="hidden" class="curr-value" value="CNY" />
</div>
</div>

<!-- 交换按钮 -->
<button id="swapBtn" class="bg-primary text-white w-12 h-12 rounded-full flex items-center justify-center text-xl hover:bg-primary/90 transition shrink-0">
<i class="fa fa-exchange"></i>
</button>

<!-- 【到币种】自定义下拉 -->
<div class="w-full">
<label id="labelTo" class="block text-stone-700 mb-2 font-medium">到</label>
<div class="relative currency-dropdown">
<div class="input-border w-full px-4 py-3 text-lg bg-white flex justify-between items-center cursor-pointer dropdown-trigger">
<span class="curr-label">美元 (USD)</span>
<i class="fa fa-chevron-down text-stone-400"></i>
</div>
<div class="dropdown-panel hidden">
<input type="text" class="curr-search w-full px-4 py-2 border-b border-stone-200 focus:outline-none" placeholder="搜索币种代码/名称..." />
<div class="option-list max-h-64 overflow-y-auto"></div>
</div>
<input type="hidden" class="curr-value" value="USD" />
</div>
</div>
</div>

<!-- 换算按钮 -->
<button id="calcBtn" class="w-full bg-primary text-white py-4 rounded-xl text-lg font-medium hover:bg-primary/90 transition mb-6">
<span id="btnCalc">立即换算</span>
</button>

<!-- 结果区域 -->
<div class="bg-resultBg rounded-2xl p-6">
<p id="resultText" class="text-[clamp(1.2rem,2vw,1.6rem)] text-stone-800 mb-3">加载汇率中...</p>
<p id="rateInfo" class="text-stone-500"></p>
</div>
<div id="updateDate" class="text-right text-stone-500 mt-4 text-sm"></div>
</div>

<!-- ========== 独立：今日汇率表 单独圆角卡片容器 ========== -->
<div class="bg-cardBg rounded-3xl p-6 md:p-10 shadow-soft mb-6">

<span class="text-stone-400 col-span-2 md:col-span-4">汇率加载中...</span>
</div>
</div>

<!-- ========== 新增：信息卡片 ========== -->

<span id="infoTag" class="info-tag">今日汇率参考</span>

<p id="copyrightText" class="text-3xl font-medium text-stone-800 mt-1">汇率换算器 (c) 2026</p>
</div>
</div>
</div>

let currentLang = "zh-CN";
let rateMap = {};
let lastUpdate = "";
const dropdowns = document.querySelectorAll('.currency-dropdown');
const rateTableWrap = document.getElementById('rateTableWrap');

function getCurrencyName(item){
  if(currentLang === "en") return item.en;
  return item.zh;
}

// 更新全站文字
function applyLang(lang){
  currentLang = lang;
  const t = i18n[lang];
  document.getElementById('langText').innerText = t.langName;
  document.getElementById('topTag').innerText = t.topTag;
  document.getElementById('mainTitle').innerText = t.mainTitle;
  document.getElementById('labelAmount').innerText = t.labelAmount;
  document.getElementById('labelFrom').innerText = t.labelFrom;
  document.getElementById('labelTo').innerText = t.labelTo;
  document.getElementById('btnCalc').innerText = t.btnCalc;
  document.getElementById('tableTitle').innerText = t.tableTitle;
  document.getElementById('infoTag').innerText = t.infoTag;
  document.getElementById('infoTitle').innerText = t.infoTitle;
  document.getElementById('lblDataDate').innerText = t.lblDataDate;
  document.getElementById('lblCopyright').innerText = t.lblCopyright;
  document.getElementById('copyrightText').innerText = t.copyrightText;

  // 更新搜索框占位
  document.querySelectorAll('.curr-search').forEach(el=>{
    el.placeholder = t.searchPlaceholder;
  })

  // 刷新下拉列表、汇率表格、计算结果
  dropdowns.forEach(d=>renderDropdown(d));
  renderRateTable();
  calculate();
}

// 语言下拉交互
const langDropdown = document.querySelector('.lang-dropdown');
const langTrigger = langDropdown.querySelector('.lang-trigger');
const langPanel = langDropdown.querySelector('.lang-dropdown-panel');
const langOptions = langDropdown.querySelectorAll('.lang-option');

langTrigger.addEventListener('click', (e)=>{
    e.stopPropagation();
    langPanel.classList.toggle('hidden');
});
langOptions.forEach(opt=>{
    opt.onclick = ()=>{
        langOptions.forEach(o=>o.classList.remove('active'));
        opt.classList.add('active');
        applyLang(opt.dataset.lang);
        langPanel.classList.add('hidden');
    }
})

// 渲染汇率标签表格（基准：1 USD）
function renderRateTable(){
  const t = i18n[currentLang];
  rateTableWrap.innerHTML = "";
  if(Object.keys(rateMap).length === 0){
    rateTableWrap.innerHTML = `<span class="text-stone-400 col-span-2 md:col-span-4">${t.tableLoading}</span>`;
    return;
  }
  currencyList.forEach(item=>{
    const r = rateMap[item.code];
    if(r === undefined) return;
    const tag = document.createElement('div');
    tag.className = "currency-tag";
    tag.innerHTML = `
<span class="tag-name" title="${getCurrencyName(item)}">${getCurrencyName(item)}</span>
<span class="tag-rate">${r.toFixed(4)}</span>
`;
    rateTableWrap.appendChild(tag);
  })
}

// 渲染下拉选项
function renderDropdown(dropEl, keyword=""){
  const listWrap = dropEl.querySelector('.option-list');
  const selectedCode = dropEl.querySelector('.curr-value').value;
  listWrap.innerHTML = "";
  const kw = keyword.toLowerCase();
  const filtered = currencyList.filter(item=>{
    const name = getCurrencyName(item).toLowerCase();
    return name.includes(kw) || item.code.toLowerCase().includes(kw);
  });
  filtered.forEach(item=>{
    const div = document.createElement('div');
    div.className = 'option-item' + (item.code === selectedCode ? ' active' : '');
    div.innerText = getCurrencyName(item);
    div.dataset.code = item.code;
    div.onclick = ()=>{
      dropEl.querySelector('.curr-value').value = item.code;
      dropEl.querySelector('.curr-label').innerText = getCurrencyName(item);
      dropEl.querySelector('.dropdown-panel').classList.add('hidden');
      calculate();
    }
    listWrap.appendChild(div);
  })
}

// 初始化每个币种下拉
dropdowns.forEach(dropEl=>{
  renderDropdown(dropEl);
  dropEl.querySelector('.dropdown-trigger').addEventListener('click',(e)=>{
    e.stopPropagation();
    const panel = dropEl.querySelector('.dropdown-panel');
    dropdowns.forEach(d=>{
      if(d!==dropEl) d.querySelector('.dropdown-panel').classList.add('hidden');
    })
    panel.classList.toggle('hidden');
    if(!panel.classList.contains('hidden')){
      dropEl.querySelector('.curr-search').focus();
    }
  })
  dropEl.querySelector('.curr-search').addEventListener('input',(e)=>{
    renderDropdown(dropEl, e.target.value);
  })
})

document.addEventListener('click',()=>{
  dropdowns.forEach(d=>{
    d.querySelector('.dropdown-panel').classList.add('hidden');
  })
  langPanel.classList.add('hidden');
})

function getFromTo(){
  const from = document.querySelectorAll('.curr-value')[0].value;
  const to = document.querySelectorAll('.curr-value')[1].value;
  return {from,to};
}

async function fetchRates() {
  const t = i18n[currentLang];
  try {
    const res = await fetch("https://open.er-api.com/v6/latest/USD");
    const data = await res.json();
    if(data.result !== "success"){
      alert(t.fetchFail);
      return;
    }
    rateMap = data.rates;
    const d = new Date(data.time_last_update_utc);
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    lastUpdate = `${year}-${month}-${day}`;
    // 同步更新底部信息卡片日期
    document.getElementById("infoDate").innerText = lastUpdate;
    document.getElementById("infoDateShow").innerText = lastUpdate;
    calculate();
    renderRateTable();
  } catch(e) {
    console.error(e);
    alert(t.networkErr);
  }
}

function calculate(){
  const t = i18n[currentLang];
  const amount = parseFloat(document.getElementById('amount').value);
  const {from, to} = getFromTo();

  if(isNaN(amount) || amount <= 0) return;
  if(!rateMap[from] || !rateMap[to]){
    document.getElementById("resultText").innerText = t.noRateData;
    document.getElementById("rateInfo").innerText = "";
    document.getElementById("updateDate").innerText = "";
    return;
  }

  const result = amount * (rateMap[to] / rateMap[from]);
  const oneUnitRate = rateMap[to] / rateMap[from];

  document.getElementById("resultText").innerText = `${amount} ${from} ≈ ${result.toFixed(6)} ${to}`;
  document.getElementById("rateInfo").innerText = t.rateLine.replace('{date}',lastUpdate).replace('{from}',from).replace('{rate}',oneUnitRate.toFixed(6)).replace('{to}',to);
  document.getElementById("updateDate").innerText = t.updatePrefix + lastUpdate;
}

function swapCurrency(){
  const val0 = document.querySelectorAll('.curr-value')[0];
  const val1 = document.querySelectorAll('.curr-value')[1];
  const label0 = document.querySelectorAll('.curr-label')[0];
  const label1 = document.querySelectorAll('.curr-label')[1];

  const tempCode = val0.value;
  const tempName = label0.innerText;

  val0.value = val1.value;
  label0.innerText = label1.innerText;
  val1.value = tempCode;
  label1.innerText = tempName;

  renderDropdown(dropdowns[0]);
  renderDropdown(dropdowns[1]);
  calculate();
}

document.getElementById('calcBtn').addEventListener('click', calculate);
document.getElementById('swapBtn').addEventListener('click', swapCurrency);
document.getElementById('amount').addEventListener('input', calculate);

fetchRates();
</script>
