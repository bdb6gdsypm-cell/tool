<script>
let solarTermMap = {}; // 新版节气：{年份: {节气名: "yyyy-MM-dd HH:mm:ss"}}
let lunarFestivalMap = {};
let holidayMap = {};
let lunarDateMap = {};
let festivalDateMap = {};
let ganzhiMap = {}; // 干支缓存 农历json/干支1900-2100.json
let almanacMap = {}; // 宜忌缓存 农历json/宜忌1900-2100.json

// 生肖表，地支顺序
const zodiacList = ["鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"];
function getZodiac(year){
const idx = (year - 4) % 12;
return zodiacList[idx];
}

// 根据【春节（正月初一）】计算生肖
function getZodiacBySpring(targetDate){
const y = targetDate.getFullYear();
let springStr = festivalDateMap[y]?.['春节'];
if (!springStr) {
springStr = festivalDateMap[y+1]?.['春节'];
    }
if(!springStr){
// 没有春节数据，降级用阳历年
return getZodiac(y);
    }
const springDt = parseDateStr(springStr);
if(targetDate < springDt){
// 春节前，用上一年生肖
return getZodiac(y - 1);
    }else{
// 春节及之后，本年生肖
return getZodiac(y);
    }
}

// 获取星座
function getConstellation(m, d){
const arr = [
        [1,20,"水瓶座"],
        [2,19,"双鱼座"],
        [3,21,"白羊座"],
        [4,20,"金牛座"],
        [5,21,"双子座"],
        [6,22,"巨蟹座"],
        [7,23,"狮子座"],
        [8,23,"处女座"],
        [9,23,"天秤座"],
        [10,24,"天蝎座"],
        [11,23,"射手座"],
        [12,22,"摩羯座"]
    ];
if(m === 1 && d < 20) return "摩羯座";
for(let item of arr){
if(m === item[0]){
if(d >= item[1]) return item[2];
else {
const prev = arr[(arr.indexOf(item)+11)%12];
return prev[2];
            }
        }
    }
return "";
}

// 处理农历显示：正月初一 → 正月；正月初二 → 初二
function formatLunarShow(text) {
if (!text) return '';
if (text.includes('初一')) {
return text.replace('初一', '');
    }
// 兼容闰月，正则匹配闰月+月份
return text.replace(/^(闰)?(正|二|三|四|五|六|七|八|九|十|冬|腊)月/, '');
}

// 解析 "yyyy-mm-dd" 字符串返回Date
function parseDateStr(s) {
const [y,m,d] = s.split('-').map(Number);
return new Date(y, m-1, d);
}

// 解析带时分秒的节气时间字符串
function parseDateTimeStr(s) {
return new Date(s.replace(/-/g, '/'));
}

// 根据日期key，获取当天节气名称
function getDaySolarTermName(dateKey){
const [y,m,d] = dateKey.split('-').map(Number);
const yearStr = String(y);
if(!solarTermMap[yearStr]) return '';
const yearTerms = solarTermMap[yearStr];
for(let termName in yearTerms){
const t = parseDateTimeStr(yearTerms[termName]);
const ty = t.getFullYear();
const tm = t.getMonth()+1;
const td = t.getDate();
if(ty === y && tm === m && td === d){
return termName;
        }
    }
return '';
}

// 【核心】根据目标日期，在 solarTermMap 找最近上一个、下一个节气
function findNearestSolarTerm(targetDate) {
let allTerms = [];
// 遍历所有年份、所有节气
for (const yearKey in solarTermMap) {
const y = parseInt(yearKey);
const termObj = solarTermMap[yearKey];
for (const termName in termObj) {
const dt = parseDateTimeStr(termObj[termName]);
allTerms.push({ name: termName, timeStr: termObj[termName], date: dt });
        }
    }
// 按时间排序
allTerms.sort((a, b) => a.date - b.date);

let lastTerm = null;
let nextTerm = null;
for (let i = 0; i < allTerms.length; i++) {
const item = allTerms[i];
if (item.date <= targetDate) {
lastTerm = item;
        } else {
nextTerm = item;
break;
        }
    }
return { lastTerm, nextTerm };
}

// 跳转到指定年份+节气
function jumpSolarTerm(year, termName) {
if(!solarTermMap[year] || !solarTermMap[year][termName]) return;
const timeStr = solarTermMap[year][termName];
const targetDate = parseDateTimeStr(timeStr);
currentDate = new Date(targetDate.getFullYear(), targetDate.getMonth(), 1);
selectDate = new Date(targetDate);
renderCalendar();
}

// 查找下一个元旦
function getNextNewYear(fromDate){
const y = fromDate.getFullYear();
let ny = new Date(y+1,0,1);
if(fromDate < new Date(y,0,1)){
ny = new Date(y,0,1);
}
return ny;
}

// 查找下一个春节（遍历festivalDateMap）
function getNextSpringFestival(fromDate){
let springDates = [];
for(let y in festivalDateMap){
if(festivalDateMap[y]['春节']){
springDates.push(parseDateStr(festivalDateMap[y]['春节']));
}
}
springDates.sort((a,b)=>a-b);
for(let d of springDates){
if(d >= fromDate){
return d;
}
}
return null;
}

// 跳转到指定年份+节日
function jumpFestival(year, festivalName) {
if(!festivalDateMap[year] || !festivalDateMap[year][festivalName]) return;
const targetDate = parseDateStr(festivalDateMap[year][festivalName]);
currentDate = new Date(targetDate.getFullYear(), targetDate.getMonth(), 1);
selectDate = new Date(targetDate);
renderCalendar();
}

// 加载干支json

const res = await fetch("./农历json/干支1900-2100.json");

ganzhiMap = await res.json();

// 加载农历节日json，格式 { "2026-09-17":"中秋节" }
async function loadLunarFestivalJson() {

// 加载法定节假日&调休
async function loadHolidayJson() {
try {
const res = await fetch("./农历json/法定节假日放假调休1900-2100.json");
if (!res.ok) throw new Error("节假日json not found");

    } catch (err) {
console.warn("❌ 加载节假日json失败：", err);

    }
await loadLunarDateJson();

// 加载农历日期json：农历1900-2100.json，格式同节气 {"1900-01-01":"正月初一"}
async function loadLunarDateJson() {
try {
const res = await fetch("./农历json/农历1900-2100.json");
if (!res.ok) throw new Error("农历json not found");
lunarDateMap = await res.json();
console.log("✅ 农历日期加载成功");
    } catch (err) {
console.warn("❌ 加载农历日期json失败：", err);
lunarDateMap = {};
    }
await loadAlmanacJson();
}
// 加载宜忌json
async function loadAlmanacJson() {
try {
const res = await fetch("./农历json/宜忌1900-2100.json");
if (!res.ok) throw new Error("宜忌1900-2100.json not found");
almanacMap = await res.json();
console.log("✅ 宜忌数据加载成功");
    } catch (err) {
console.warn("❌ 加载宜忌json失败：", err);
almanacMap = {};
    }
renderCalendar();
}

// 普通纪念日
const otherFestival = {
'11-08':'记者节'
};

// ========== 全局状态 ==========
let currentDate = new Date();
let selectDate = new Date();
const calendarWrap = document.getElementById('calendarWrap');
const yearSelect = document.getElementById('yearSelect');
const monthSelect = document.getElementById('monthSelect');
const filterSelect = document.getElementById('filterSelect');
const solarTermSelect = document.getElementById('solarTermSelect');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const todayBtn = document.getElementById('todayBtn');

// 右侧黄历的上下天按钮
const infoPrevDay = document.getElementById('infoPrevDay');
const infoNextDay = document.getElementById('infoNextDay');
infoPrevDay.onclick = ()=>{
selectDate.setDate(selectDate.getDate()-1);
renderCalendar();
};
infoNextDay.onclick = ()=>{
selectDate.setDate(selectDate.getDate()+1);
renderCalendar();
};

// 节日下拉切换
filterSelect.onchange = function(){
const festival = this.value;
if(!festival) return;
solarTermSelect.value = ""; // 清空节气选择
const y = +yearSelect.value;
jumpFestival(y, festival);
}

// 节气下拉切换（新增）
solarTermSelect.onchange = function(){
const term = this.value;
if(!term) return;
filterSelect.value = ""; // 清空假期选择
const y = +yearSelect.value;
jumpSolarTerm(y, term);
}

// ========== 初始化下拉框 1900 ~ 2100 ==========
function initSelect(){
yearSelect.innerHTML = '';
for(let y=1900;y<=2100;y++){
const opt = document.createElement('option');
opt.value = y;
opt.innerText = y+'年';
yearSelect.appendChild(opt);
  }
monthSelect.innerHTML = '';
for(let m=1;m<=12;m++){
const opt = document.createElement('option');
opt.value = m;
opt.innerText = m+'月';
monthSelect.appendChild(opt);
  }
bindSelectChange();
}
function bindSelectChange(){
yearSelect.onchange = ()=>{
const selectedFestival = filterSelect.value;
const selectedTerm = solarTermSelect.value;
const y = +yearSelect.value;
if(selectedFestival){
jumpFestival(y, selectedFestival);
}else if(selectedTerm){
jumpSolarTerm(y, selectedTerm);
}else{
currentDate.setFullYear(y);
renderCalendar();
}
  }
monthSelect.onchange = ()=>{
currentDate.setMonth(+monthSelect.value -1);
renderCalendar();
  }
}

// ========== 渲染日历主体 ==========
function renderCalendar(){
const y = currentDate.getFullYear();
const m = currentDate.getMonth();
yearSelect.value = y;
monthSelect.value = m+1;

calendarWrap.innerHTML = '';
const firstDay = new Date(y,m,1);
const lastDay = new Date(y,m+1,0);
// 周日为0，周一1 ... 周六6，适配周日第一列
let firstWeek = firstDay.getDay();
const prevMonthLast = new Date(y,m,0).getDate();

for(let i= firstWeek -1; i>=0; i--){
const d = prevMonthLast - i;
const div = createCell(y,m-1,d,true);
calendarWrap.appendChild(div);
  }
for(let d=1;d<=lastDay.getDate();d++){
const div = createCell(y,m,d,false);
calendarWrap.appendChild(div);
  }
const totalRendered = firstWeek + lastDay.getDate();
const nextFill = 42 - totalRendered;
for(let d=1;d<=nextFill;d++){
const div = createCell(y,m+1,d,true);
calendarWrap.appendChild(div);
  }
updateInfoPanel(selectDate);
}

// ========== 创建格子 ==========
function createCell(y,m,d,isOtherMonth){
const dateObj = new Date(y,m,d);
const dateKey = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const solarMd = `${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const holidayItem = holidayMap[dateKey];
const lunarRaw = lunarDateMap[dateKey] || '';
const lunarStr = formatLunarShow(lunarRaw);
const termName = getDaySolarTermName(dateKey);

let festivalName = lunarFestivalMap[dateKey] || otherFestival[solarMd] || '';

const div = document.createElement('div');
div.className = 'calendar-cell';
div.dataset.date = dateKey;

const isToday = isSameDay(dateObj, new Date());
const isSelected = isSameDay(dateObj, selectDate);

if(isOtherMonth){
div.classList.add('text-slate-400');
  }else{
if(isToday) div.classList.add('cell-today');
if(isSelected && !isToday) div.classList.add('cell-active');
if(holidayItem?.type === 'rest') div.classList.add('cell-rest');
  }

let html = `<div class="font-medium">${d}</div>`;
if(holidayItem?.type === 'rest') html += `<span class="badge-rest">休</span>`;
else if(holidayItem?.type === 'work') html += `<span class="badge-work">班</span>`;

// 优先级：节气 > 节日 > 农历
if(termName){
html += `<div class="festival-text">${termName}</div>`;
}else if(festivalName){
html += `<div class="festival-text">${festivalName}</div>`;
}else if(lunarStr){
html += `<div class="lunar-text">${lunarStr}</div>`;
}

if(isToday) html += `<span class="badge-today">今</span>`;
div.innerHTML = html;

div.onclick = ()=>{
selectDate = new Date(y,m,d);
renderCalendar();
  }
return div;
}

// ========== 更新右侧黄历面板 ==========
function updateInfoPanel(dt){
const now = new Date();
const y = dt.getFullYear(), m=dt.getMonth()+1, d=dt.getDate();
const weekArr = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const weekStr = weekArr[dt.getDay()];
const consName = getConstellation(m, d);
const dateKey = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

// 获取当日节气
const termName = getDaySolarTermName(dateKey);

const diffMs = dt - now;
const diffDays = Math.round(diffMs / (1000*3600*24));
let agoText = '';
if(diffDays>0) agoText = `${diffDays}天后`;
else if(diffDays<0) agoText = `${Math.abs(diffDays)}天前`;
else agoText = '今天';

const lfes = lunarFestivalMap[dateKey] || '';
const lunarRaw = lunarDateMap[dateKey] || '';

const ganzhiItem = ganzhiMap[dateKey];
let ganzhiHtml = '暂无干支';
if(ganzhiItem){
const sx = getZodiacBySpring(dt);
ganzhiHtml = `${ganzhiItem.年柱}（${sx}年） ${ganzhiItem.月柱}月 ${ganzhiItem.日柱}日`;
// 如果当天是节气，追加红色节气
if(termName){
ganzhiHtml += ` <span class="text-yiliRed">｜${termName}</span>`;
}
}

const alm = almanacMap[dateKey];
let yiText = '暂无宜忌';
let jiText = '暂无宜忌';
if(alm){
yiText = Array.isArray(alm.宜)
? (alm.宜.length > 0 ? alm.宜.join(' ') : '无')
: alm.宜;
jiText = Array.isArray(alm.忌)
? (alm.忌.length > 0 ? alm.忌.join(' ') : '无')
: alm.忌;
}

const { lastTerm, nextTerm } = findNearestSolarTerm(dt);
let prevTermText = '无';
let nextTermText = '无';
if(lastTerm){
prevTermText = `<span class="text-yiliRed font-medium">${lastTerm.name}</span> <span class="text-black font-normal">（${lastTerm.timeStr}）</span>`;
}
if(nextTerm){
nextTermText = `<span class="text-yiliRed font-medium">${nextTerm.name}</span> <span class="text-black font-normal">（${nextTerm.timeStr}）</span>`;
}

const nyDate = getNextNewYear(dt);
const nyYear = nyDate.getFullYear();
const nyDiff = Math.ceil((nyDate - dt) / (1000*3600*24));
document.getElementById('countNewYear').innerHTML = `<i class="fa fa-clock-o mr-1"></i>距离${nyYear}年元旦还有${nyDiff}天`;

const springDate = getNextSpringFestival(dt);
if(springDate){
const springYear = springDate.getFullYear();
const springDiff = Math.ceil((springDate - dt) / (1000*3600*24));
document.getElementById('countSpringFest').innerHTML = `<i class="fa fa-clock-o mr-1"></i>距离${springYear}年春节还有${springDiff}天`;
}else{
document.getElementById('countSpringFest').innerHTML = `<i class="fa fa-clock-o mr-1"></i>距离下一个春节：暂无春节数据`;
}

document.getElementById('infoDateText').innerText = `${y}年${m}月${d}日 ${weekStr} · ${consName}`;
document.getElementById('infoDayAgo').innerText = agoText;
document.getElementById('infoDayNum').innerText = d;
document.getElementById('infoLunarFest').innerHTML = lunarRaw + (lfes ? ' <span class="text-yiliRed">'+lfes+'</span>' : '');
document.getElementById('infoGanZhi').innerHTML = ganzhiHtml;
document.getElementById('yiText').innerText = yiText;
document.getElementById('jiText').innerText = jiText;
document.getElementById('prevTerm').innerHTML = prevTermText;
document.getElementById('nextTerm').innerHTML = nextTermText;
}

function isSameDay(d1,d2){
return d1.getFullYear() === d2.getFullYear() &&
d1.getMonth() === d2.getMonth() &&
d1.getDate() === d2.getDate();
}

prevBtn.onclick = ()=>{
currentDate.setMonth(currentDate.getMonth()-1);
renderCalendar();
}
nextBtn.onclick = ()=>{
currentDate.setMonth(currentDate.getMonth()+1);
renderCalendar();
}
todayBtn.onclick = ()=>{
filterSelect.value = "";
solarTermSelect.value = ""; // 同时清空节气选择
currentDate = new Date();
selectDate = new Date();
renderCalendar();
}

initSelect();
loadGanZhiJson();
</script>
</body>
</html>
