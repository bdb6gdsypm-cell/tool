<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全球孔子学院查询 · Confucius Institutes Worldwide</title>

<style>
:root{
  --green:#5F9F70;
  --green-d:#4C8A5C;
  --green-l:#EAF3EC;
  --page:#F1F0EE;
  --panel:#FFFFFF;
  --ink:#232323;
  --ink-2:#4A4A4A;
  --muted:#8A8A8A;
  --line:#ECEAE7;
  --line-2:#E3E1DE;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--page);color:var(--ink);font-size:15px;line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding:14px;height:100vh;height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;
}
/* 返回按钮 / Back button */
.backbar{flex:none;width:100%;max-width:1400px;margin:0 auto 10px}
.back{
  display:flex;align-items:center;justify-content:center;
  width:38px;height:38px;border-radius:50%;
  background:var(--panel);color:var(--green-d);
  border:1px solid var(--line-2);
  box-shadow:0 1px 0 rgba(35,35,35,.04);
  text-decoration:none;
  transition:background .15s,border-color .15s,transform .15s;
}
.back:hover{background:var(--green-l);border-color:var(--green);transform:translateX(-2px)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--green-d);outline-offset:3px}
input::placeholder{color:#A6A6A6}
input[type="search"]{-webkit-appearance:none;appearance:none}
input[type="search"]::-webkit-search-decoration,
input[type="search"]::-webkit-search-cancel-button,
input[type="search"]::-webkit-search-results-button,
input[type="search"]::-webkit-search-results-decoration{display:none;-webkit-appearance:none}

/* ---------- 外框 ---------- */
.shell{
  max-width:1400px;margin:0 auto;background:var(--panel);
  border-radius:20px;overflow:hidden;
  box-shadow:0 10px 40px rgba(35,35,35,.07), 0 1px 0 rgba(35,35,35,.04);
  display:grid;grid-template-columns:1fr;
  grid-template-rows:auto minmax(110px,26vh) minmax(0,1fr);
  flex:1;min-height:0;width:100%;
  height:calc(100dvh - 76px);
}

/* ---------- 大洲栏 ---------- */
.rail{
  display:flex;flex-direction:row;overflow-x:auto;background:var(--green);
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.rail::-webkit-scrollbar{display:none}
.rail button{
  flex:0 0 auto;min-width:96px;padding:12px 18px;color:#fff;font-size:15px;font-weight:600;
  letter-spacing:.02em;white-space:nowrap;text-align:center;
  border-right:1px solid rgba(255,255,255,.22);
  transition:background .18s;
  display:flex;flex-direction:row;align-items:baseline;justify-content:center;gap:6px;
}
.rail button .en{font-size:11px;font-weight:500;letter-spacing:.04em;opacity:.8}
.rail button[aria-selected="true"] .en{opacity:.75}
.rail button[aria-selected="true"]{background:var(--panel);color:var(--green-d);border-right-color:transparent}
.rail button:not([aria-selected="true"]):hover{background:var(--green-d)}

/* ---------- 国家栏 ---------- */
.countries{
  border-bottom:1px solid var(--line-2);
  min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 16px;
}
.countries .grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 6px;
}
.countries button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  width:100%;text-align:center;padding:5px 8px;border-radius:999px;
  font-size:13px;color:var(--ink-2);line-height:1.28;background:transparent;
  border:1px solid transparent;
  overflow:hidden;
  transition:background .15s,color .15s,border-color .15s;
}
.countries button .zh{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.countries button .en{font-size:9.5px;line-height:1.25;color:var(--muted);letter-spacing:.01em;max-width:100%;word-break:break-word}
.countries button:hover{background:var(--green-l);color:var(--green-d)}
.countries button:hover .en{color:var(--green-d)}
.countries button[aria-pressed="true"]{background:var(--green);color:#fff;font-weight:500;border-color:var(--green)}
.countries button[aria-pressed="true"] .en{color:rgba(255,255,255,.85)}
.countries button[aria-pressed="true"]:hover{background:var(--green-d);color:#fff;border-color:var(--green-d)}

/* ---------- 右侧内容 ---------- */
.detail{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.banner{position:relative;flex:none;height:170px;background:#DDD9D2;overflow:hidden}
.banner img{width:100%;height:100%;object-fit:cover;object-position:center 45%;display:block}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(35,35,35,.18),rgba(35,35,35,.05))}

.searchbar{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  width:min(560px,calc(100% - 28px));
  display:flex;align-items:center;gap:10px;
  background:#fff;border-radius:999px;padding:5px 6px 5px 18px;
  box-shadow:0 6px 22px rgba(35,35,35,.16);
}
.searchbar svg{width:22px;height:22px;color:#B9B9B9;flex:none}
.searchbar input{
  flex:1;min-width:0;border:0;background:transparent;outline:none;
  font-size:16px;color:var(--ink);padding:11px 0;
}
.searchbar .clear{
  flex:none;width:34px;height:34px;border-radius:999px;display:none;
  align-items:center;justify-content:center;color:#9A9A9A;
}
.searchbar .clear:hover{background:var(--green-l);color:var(--green-d)}
.searchbar .clear.show{display:flex}

.content{flex:1;min-height:0;padding:22px 20px 34px;overflow-y:auto;overscroll-behavior:contain}
.head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 2px}
.head h1{font-size:24px;line-height:1.3;margin:0;font-weight:700;letter-spacing:.01em}
.head .en-title{font-size:14px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.head .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.head .hint{font-size:12.5px;color:var(--muted);margin:6px 0 0;width:100%;line-height:1.6}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}

.list{margin-top:16px;border-top:1px solid var(--line)}
.item{
  display:flex;align-items:flex-start;gap:12px;
  padding:15px 2px 14px;border-bottom:1px solid var(--line);
}
.item .dot{flex:none;width:7px;height:7px;background:var(--green);align-self:flex-start;margin-top:8px}
.item .namebox{flex:1;min-width:0}
.item .name{display:block;font-size:15.5px;line-height:1.45;word-break:break-word}
.item .en-name{display:block;font-size:12.5px;line-height:1.4;color:var(--muted);margin-top:2px;word-break:break-word}
.item .citybox{flex:none;text-align:right;max-width:108px;min-width:0;align-self:flex-start;margin-top:1px}
.item .city{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.item .city-en{display:block;font-size:10.5px;color:#9A9A96;line-height:1.3;word-break:break-word;margin-top:1px}
.item .city.unknown{color:#BFBFBF}

.empty{padding:46px 2px;color:var(--muted)}
.empty h2{font-size:17px;color:var(--ink);margin:0 0 6px;font-weight:600}
.empty p{margin:0 0 16px;font-size:14px}
.empty button{border:1px solid var(--line-2);border-radius:999px;padding:8px 18px;font-size:14px;color:var(--ink-2)}
.empty button:hover{border-color:var(--green);color:var(--green-d)}

mark{background:#DCEEDF;color:inherit;padding:0 1px}

/* ---------- ≥900px ---------- */
@media (min-width:900px){
  body{padding:40px 40px 48px}
  .backbar{margin-bottom:12px}
  .back{width:42px;height:42px}
  .shell{
    grid-template-columns:184px 452px minmax(0,1fr);
    grid-template-rows:minmax(0,1fr);
    height:calc(100vh - 142px);min-height:460px;border-radius:26px;
  }
  .rail{flex-direction:column;overflow-y:auto}
  .rail button{
    flex:1 1 0;min-width:0;font-size:17px;padding:10px 12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    border-right:0;border-bottom:1px solid rgba(255,255,255,.28);
  }
  .rail button .en{font-size:11.5px}
  .rail button[aria-selected="true"]{border-bottom-color:var(--line-2);box-shadow:inset -3px 0 0 var(--green)}
  .rail button:last-child{border-bottom:0}
  .countries{
    max-height:none;padding:26px 22px;border-bottom:0;border-right:1px solid var(--line-2);
  }
  .countries .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 6px}
  .countries button{padding:9px 10px;font-size:15px}
  .banner{height:232px}
  .content{padding:30px 34px 40px}
  .head h1{font-size:30px}
  .item{padding:19px 2px 17px}
  .item .name{font-size:16px}
}
@media (min-width:1280px){
  .content{padding:34px 56px 46px}
  .list{max-width:780px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const CONT = [["亚洲","Asia"],["欧洲","Europe"],["非洲","Africa"],["美洲","Americas"],["大洋洲","Oceania"]];
const CONT_EN = Object.fromEntries(CONT);
const CONTINENTS = CONT.map(c=>c[0]);
const byName = (a,b)=>a.localeCompare(b,"zh-Hans-CN");
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");

const countryEn = (()=>{
  const m = new Map();
  DATA.forEach(d=>{ if(!m.has(d["所在国家"])) m.set(d["所在国家"], d["所在国家英"] || ""); });
  return m;
})();

const state = { continent:"亚洲", country:"", q:"" };

const elRail = document.getElementById("rail");
const elCountries = document.getElementById("countries");
const elList = document.getElementById("list");
const elTitle = document.getElementById("title");
const elTitleEn = document.getElementById("titleEn");
const elSub = document.getElementById("subtitle");
const elHint = document.getElementById("hint");
const elQ = document.getElementById("q");

const countriesOf = c => {
  const m = new Map();
  DATA.filter(d=>d["所在大洲"]===c).forEach(d=>m.set(d["所在国家"], (m.get(d["所在国家"])||0)+1));
  return [...m.entries()].sort((a,b)=>byName(a[0],b[0]));
};
const institutesOf = c => DATA.filter(d=>d["所在国家"]===c)
  .slice().sort((a,b)=>byName(a["孔子学院名称"], b["孔子学院名称"]));

/* 大洲 / Continents */
elRail.innerHTML = CONT.map(([zh,en])=>`<button type="button" role="tab" data-c="${esc(zh)}" aria-selected="false"><span class="zh">${esc(zh)}</span><span class="en">${esc(en)}</span></button>`).join("");
elRail.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  state.continent = b.dataset.c; state.q = ""; elQ.value = "";
  elClearQ.classList.remove("show");
  state.country = (countriesOf(state.continent)[0] || [""])[0];
  render();
});

/* 国家 / Countries */
elCountries.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  state.country = b.dataset.country;
  state.q = ""; elQ.value = "";
  elClearQ.classList.remove("show");
  render();
});

/* 搜索：输入即实时查询 / live search */
document.getElementById("searchForm").addEventListener("submit", e=>e.preventDefault());
const elClearQ = document.getElementById("clearQ");
let searchTimer = null;
elQ.addEventListener("input", ()=>{
  const v = elQ.value.trim();
  elClearQ.classList.toggle("show", v.length>0);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{ state.q = v; render(); }, 90);
});
elClearQ.addEventListener("click", ()=>{
  elQ.value = ""; elClearQ.classList.remove("show");
  state.q = ""; render(); elQ.focus();
});

function render(){
  const list = countriesOf(state.continent);
  if(!state.country || !list.some(([n])=>n===state.country)){
    state.country = "";
  }

  elRail.querySelectorAll("button").forEach(b=>{
    b.setAttribute("aria-selected", String(b.dataset.c===state.continent));
  });

  elCountries.innerHTML = list.map(([name, n])=>`
    <button type="button" data-country="${esc(name)}" aria-pressed="${name===state.country && !state.q}">
      <span class="zh">${esc(name)}</span>
      <span class="en">${esc(countryEn.get(name) || "")}</span>
    </button>`).join("");

  const q = state.q.toLowerCase();
  let rows, title, titleEn, sub, hint;

  if(q){
    rows = DATA.filter(d=>{
      const hay = [d["孔子学院名称"], d["孔子学院名称英"], d["所在国家"], d["所在国家英"], d["所在城市"], d["所在城市英"]].join(" ").toLowerCase();
      return hay.includes(q);
    });
    title = `“${state.q}”`;
    titleEn = "Search results";
    sub = `${rows.length} 所 / ${rows.length} found`;
    hint = "在全部 500 所孔子学院中检索名称、国家与城市。Searching all 500 institutes worldwide.";
  } else if(state.country){
    rows = institutesOf(state.country);
    title = state.country;
    titleEn = countryEn.get(state.country) || "";
    sub = `${rows.length} 所 / ${rows.length} institute${rows.length>1?"s":""}`;
    hint = `${state.continent} · ${CONT_EN[state.continent]}　数据来源：孔子学院全球门户 ci.cn / Source: ci.cn`;
  } else {
    rows = [];
    title = state.continent;
    titleEn = CONT_EN[state.continent] || "";
    sub = "";
    hint = "选择国家，或直接输入关键词。Select a country, or type a keyword.";
  }

  elTitle.textContent = title;
  elTitleEn.textContent = titleEn;
  elSub.textContent = sub;
  elHint.textContent = hint;

  if(!rows.length){
    elList.innerHTML = `<div class="empty">
      <h2>没有匹配的孔子学院 / No institute found</h2>
      <p>换个关键词试试，或回到按国家浏览。Try another keyword, or browse by country.</p>
      <button type="button" id="backBtn">清空搜索 / Clear search</button>
    </div>`;
    const back = document.getElementById("backBtn");
    back.addEventListener("click", ()=>{ state.q=""; elQ.value=""; elClearQ.classList.remove("show"); render(); elQ.focus(); });
    return;
  }

  const re = q ? new RegExp(escRe(state.q),"i") : null;
  const hi = s => re ? esc(s).replace(re, m=>`<mark>${m}</mark>`) : esc(s);

  elList.innerHTML = rows.map(d=>{
    const city = d["所在城市"];
    const nameEn = d["孔子学院名称英"] || "";
    return `<div class="item">
      <span class="dot" aria-hidden="true"></span>
      <span class="namebox">
        <span class="name">${hi(d["孔子学院名称"])}</span>
        <span class="en-name">${hi(nameEn)}</span>
      </span>
      <span class="citybox">
        <span class="city${city?"":" unknown"}">${city?hi(city):"—"}</span>
        <span class="city-en">${city?hi(d["所在城市英"]||""):" "}</span>
      </span>
    </div>`;
  }).join("");
}

state.country = (countriesOf(state.continent)[0] || [""])[0];
render();

</script>
</body>
</html>
