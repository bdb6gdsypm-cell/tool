<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元素周期表 · Periodic Table</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%2314201f'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='5.5' fill='none' stroke='%233c7fb0' stroke-width='2'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='5.5' fill='none' stroke='%23c95a4d' stroke-width='2' transform='rotate(60 16 16)'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='5.5' fill='none' stroke='%236c9a76' stroke-width='2' transform='rotate(120 16 16)'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f5f6f4;--panel:#ffffff;--ink:#14201f;--muted:#5f6d6b;--faint:#93a09d;
    --line:#dde3e0;--line-soft:#e9eeeb;
    --am:#c95a4d;--ae:#d99a3c;--tm:#4b6fbf;--ptm:#7a8b99;--ml:#6c9a76;
    --nm:#3f8f8a;--hl:#8f5ab0;--ng:#3c7fb0;--ln:#b06a8f;--an:#8c6a4f;--un:#8a8a86;
    --radius:8px;
    --mono:"SF Mono","JetBrains Mono",Consolas,monospace;
    --serif:"Songti SC","STSong","Noto Serif SC",serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  .shell{max-width:1180px;margin:0 auto;padding:0 16px 64px;}

  .topbar{position:sticky;top:0;z-index:30;background:rgba(245,246,244,.92);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .topbar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;}
  .back{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
    background:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;}
  .back svg{width:15px;height:15px;stroke:var(--ink);}
  .brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.01em;}
  .brand h1 i{font-style:normal;font-weight:400;color:var(--faint);font-size:12px;letter-spacing:.02em;margin-left:6px;}
  .brand p{margin:2px 0 0;font-size:11.5px;color:var(--muted);}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);
    border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden;margin:16px 0 14px;}
  .stat{background:var(--panel);padding:12px 14px;}
  .stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.1;}
  .stat span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;}

  .searchbar{display:flex;align-items:center;gap:10px;background:var(--panel);
    border:1px solid var(--line);border-radius:999px;padding:10px 16px;}
  .searchbar svg{width:16px;height:16px;stroke:var(--muted);flex:0 0 auto;}
  .searchbar input{flex:1;min-width:0;border:0;outline:0;background:transparent;
    font-size:16px;color:var(--ink);letter-spacing:.01em;}
  .searchbar input::placeholder{color:var(--faint);}
  .clearbtn{border:0;background:transparent;color:var(--faint);font-size:12px;cursor:pointer;padding:4px;display:none;}
  .clearbtn.show{display:block;}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 6px;}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);
    font-size:12px;padding:5px 11px;border-radius:999px;cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:6px;}
  .chip:hover{border-color:#c3cfca;color:var(--ink);}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .chip .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}

  .subline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:14px 0 8px;}
  .subline h2{margin:0;font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.02em;}
  .subline .hint{font-size:11.5px;color:var(--faint);}

  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .ptable{display:grid;grid-template-columns:28px repeat(18,minmax(0,1fr));
    gap:3px;min-width:880px;padding:2px 2px 12px;}
  .gh,.phcell{display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:10px;color:var(--faint);height:18px;}

  .el{position:relative;aspect-ratio:1/1;border-radius:7px;border:1px solid transparent;
    background:var(--panel);padding:4px 5px 3px;cursor:pointer;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    transition:transform .12s,border-color .16s,box-shadow .16s,opacity .16s;font-family:inherit;}
  .el:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(20,32,31,.10);z-index:2;}
  .el:focus-visible{outline:2px solid #35566b;outline-offset:2px;}
  .el .z{position:absolute;top:3px;left:5px;font-family:var(--mono);font-size:9px;color:var(--muted);line-height:1;}
  .el .sym{font-family:var(--serif);font-size:16px;font-weight:700;line-height:1;margin-top:4px;}
  .el .cn{font-size:10px;color:var(--muted);margin-top:2px;line-height:1;white-space:nowrap;}
  .el .ms{font-family:var(--mono);font-size:8.5px;color:var(--faint);margin-top:1px;line-height:1;}
  .el.dim{opacity:.26;}
  .el.hit{border-color:#35566b;box-shadow:0 0 0 2px rgba(53,86,107,.16);}

  .elist{display:none;border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden;background:var(--panel);}
  .erow{display:grid;grid-template-columns:26px 40px 1fr auto;gap:10px;align-items:baseline;
    padding:10px 12px;border-bottom:1px solid var(--line-soft);cursor:pointer;}
  .erow:last-child{border-bottom:0;}
  .erow .z{font-family:var(--mono);font-size:10px;color:var(--faint);}
  .erow .sym{font-family:var(--serif);font-size:15px;font-weight:700;}
  .erow .nm{font-size:13.5px;}
  .erow .nm em{font-style:normal;color:var(--faint);font-size:11px;margin-left:6px;}
  .erow .ms{font-family:var(--mono);font-size:10.5px;color:var(--muted);}

  .legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);}
  .lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
  .lg i{width:10px;height:10px;border-radius:3px;display:inline-block;}

  .mask{position:fixed;inset:0;background:rgba(15,24,23,.42);z-index:60;
    display:flex;align-items:center;justify-content:center;padding:16px;}
  .mask[hidden]{display:none;}
  .card{width:100%;max-width:520px;max-height:86vh;overflow:auto;background:var(--panel);
    border-radius:12px;border-top:3px solid #35566b;box-shadow:0 18px 50px rgba(10,20,20,.24);
    padding:20px 20px 16px;position:relative;}
  .card:focus{outline:none;}
  .card .close{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;
    border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;color:var(--muted);line-height:1;}
  .card .head{display:flex;align-items:flex-start;gap:14px;padding-right:26px;}
  .card .tile{flex:0 0 62px;height:62px;border-radius:10px;border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .card .tile b{font-family:var(--serif);font-size:22px;line-height:1;}
  .card .tile span{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:3px;}
  .card h3{margin:0;font-size:19px;font-weight:700;letter-spacing:.02em;}
  .card h3 i{font-style:normal;font-weight:400;color:var(--faint);font-size:12px;margin-left:8px;}
  .card .meta{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.7;}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:11px 16px;margin-top:14px;padding-top:13px;
    border-top:1px dashed #cfd9d4;}
  .kv div{min-width:0;}
  .kv label{display:block;font-size:10.5px;color:var(--faint);margin-bottom:2px;letter-spacing:.02em;}
  .kv p{margin:0;font-size:12.5px;line-height:1.6;word-break:break-word;}
  .kv .wide{grid-column:1/-1;}
  .note{margin-top:13px;padding-top:11px;border-top:1px solid var(--line-soft);
    font-size:12.5px;line-height:1.8;color:#3d4a48;}
  .foot{margin-top:12px;font-size:10.5px;color:var(--faint);}

  .empty{display:none;text-align:center;padding:36px 12px;color:var(--muted);font-size:13px;}
  .empty.show{display:block;}

  @media (max-width:900px){
    .shell{padding:0 12px 56px;}
    .stats{grid-template-columns:repeat(2,1fr);}
    .el .sym{font-size:14px;}
    .el .cn{font-size:9.5px;}
    .el .ms{display:none;}
  }
  @media (max-width:680px){
    .tablewrap{display:none;}
    .elist{display:block;}
    .brand p{display:none;}
    .subline{margin-top:10px;}
    .mask{align-items:flex-end;padding:0;}
    .card{max-width:none;max-height:88vh;border-radius:14px 14px 0 0;padding:18px 16px 18px;}
    .kv{grid-template-columns:1fr;gap:9px;}
    .chip{font-size:11.5px;padding:5px 10px;}
  }
</style>
</head>

<script>
(function(){

    if (v === null || v === undefined || v === '') return '—';

    if (e.bp !== null && e.bp !== undefined && e.bp < 25) return '气态';
    if (e.mp !== null && e.mp !== undefined && e.mp > 25) return '固态';
    if (e.mp <= 25 && e.bp > 25) return '液态';

  }
  function block(e){
    if (e.cat === 'LN' || e.cat === 'AN') return 'f 区';
    if (e.g <= 2) return 's 区';
    if (e.g <= 12) return 'd 区';
    return 'p 区';
  }

  function tone(hex, a){
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);

  function cellEl(e, compact){

    btn.innerHTML = '<span class="z">' + e.z + '</span><span class="sym">' + esc(e.sym) + '</span><span class="cn">' + esc(e.cn) + '</span><span class="ms">' + mass(e) + '</span>';

  }

    var all = document.createElement('button');
    all.type = 'button'; all.className = 'chip on'; all.textContent = '全部';
    all.addEventListener('click', function(){ state.cat = 'ALL'; paint(); });
    chipsEl.appendChild(all);
    Object.keys(CATS).forEach(function(k){

      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.innerHTML = '<i class="dot" style="background:' + c.c + '"></i>' + c.t;

  }
  function paintChips(){
    var kids = chipsEl.querySelectorAll('.chip');
    var idx = 0;
    kids.forEach(function(b, i){
      var isAll = i === 0;
      b.classList.toggle('on', isAll ? state.cat === 'ALL' : (Object.keys(CATS)[i - 1] === state.cat));
    });
  }

  function match(e, q){
    if (!q) return true;
    var s = (e.cn + ' ' + e.sym + ' ' + e.z + ' ' + e.en + ' ' + (CATS[e.cat] ? CATS[e.cat].t : '') + ' ' + (e.use || '')).toLowerCase();
    return s.indexOf(q.toLowerCase()) >= 0;
  }
  function visible(e){
    if (state.cat !== 'ALL' && e.cat !== state.cat) return false;
    return match(e, state.q);
  }

  function paint(){
    paintChips();
    var any = 0;
    var gridCells = ptable.querySelectorAll('.el[data-z]');
    gridCells.forEach(function(c){
      var e = names[+c.getAttribute('data-z')];
      var ok = visible(e);
      if (ok) any++;
      c.classList.toggle('dim', !ok);
      c.classList.toggle('hit', !!state.q && ok);
    });
    // 列表
    elist.innerHTML = '';
    var shown = 0;
    ELEMENTS.forEach(function(e){
      if (!visible(e)) return;
      shown++;
      var row = document.createElement('div');
      row.className = 'erow';
      var c = CATS[e.cat] || CATS.UN;
      row.innerHTML = '<span class="z">' + e.z + '</span><span class="sym" style="color:' + c.c + '">' + esc(e.sym) + '</span>' +
        '<span class="nm">' + esc(e.cn) + '<em>' + esc(e.en) + '</em></span><span class="ms">' + mass(e) + '</span>';
      row.addEventListener('click', function(){ openCard(e.z, row); });
      elist.appendChild(row);
    });
    empty.classList.toggle('show', shown === 0);
    hint.textContent = shown === 118 ? '点击任意元素查看详情' : ('匹配 ' + shown + ' 种元素');
    clearEl.classList.toggle('show', !!state.q);
  }

  function openCard(z, from){
    var e = names[z];
    if (!e) return;
    var c = CATS[e.cat] || CATS.UN;
    var st = state25(e);
    cardBody.innerHTML =
      '<div class="head">' +
        '<div class="tile" style="background:' + tone(c.c, .10) + ';border-color:' + tone(c.c, .32) + '">' +
          '<b style="color:' + c.c + '">' + esc(e.sym) + '</b><span>' + e.z + '</span>' +
        '</div>' +
        '<div>' +
          '<h3 id="cname">' + esc(e.cn) + '<i>' + esc(e.en) + '</i></h3>' +
          '<div class="meta">' + c.t + ' · 第 ' + e.p + ' 周期 · ' + (e.g ? ('第 ' + e.g + ' 族') : 'f 区') + ' · ' + block(e) + ' · 常温下为' + st + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="kv">' +
        '<div><label>原子序数</label><p>' + e.z + '</p></div>' +
        '<div><label>相对原子质量</label><p>' + mass(e) + '</p></div>' +
        '<div><label>熔点</label><p>' + fmt(e.mp, ' °C') + '</p></div>' +
        '<div><label>沸点</label><p>' + fmt(e.bp, ' °C') + '</p></div>' +
        '<div><label>密度</label><p>' + fmt(e.den, ' g/cm³') + '</p></div>' +
        '<div><label>发现年份</label><p>' + esc(e.year) + '</p></div>' +
        '<div class="wide"><label>主要用途</label><p>' + esc(e.use) + '</p></div>' +
        (e.note ? '<div class="wide"><label>补充</label><p>' + esc(e.note) + '</p></div>' : '') +
      '</div>' +
      '<div class="foot">' + (e.z>=104 ? '中文用字为扩展区汉字，部分设备字体缺字，此处以拼音标注。' : '') + '数据为常用近似值，不同来源在熔点、沸点、密度上可能有差异；超重元素多为理论预测值。</div>';
    mask.hidden = false;
    document.querySelector('.card').focus();
    if (from) lastFocus = from;
  }
  var lastFocus = null;
  function closeCard(){
    mask.hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  document.getElementById('closeBtn').addEventListener('click', closeCard);
  mask.addEventListener('click', function(ev){ if (ev.target === mask) closeCard(); });
  document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape' && !mask.hidden) closeCard(); });

  var timer = null;
  qEl.addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(function(){ state.q = qEl.value.trim(); paint(); }, 120);
  });
  clearEl.addEventListener('click', function(){ qEl.value = ''; state.q = ''; paint(); qEl.focus(); });

  function buildLegend(){
    Object.keys(CATS).forEach(function(k){
      var c = CATS[k];
      var s = document.createElement('span');
      s.className = 'lg';
      s.innerHTML = '<i style="background:' + c.c + '"></i>' + c.t;
      legend.appendChild(s);
    });
  }

  buildTable();
  buildChips();
  buildLegend();
  paint();
})();
</script>

</body>
</html>
