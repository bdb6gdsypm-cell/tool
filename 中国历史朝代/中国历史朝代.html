<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中国历史朝代 · 起止年份 / 都城 / 君主</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23a83a2c'/%3E%3Ctext x='32' y='45' font-size='28' font-family='serif' fill='%23fff' text-anchor='middle'%3E史%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --paper:#f5efe3;--paper-2:#efe6d5;--card:#fffdf8;--ink:#1d1c19;--muted:#6c665c;
    --faint:#9a9186;--line:#e0d6c3;--seal:#a83a2c;--seal-soft:#f6e4dd;
    --jade:#2f5d4f;--ochre:#8a5a2b;--slate:#3f5d7a;--plum:#6b5b8a;
    --radius:12px;
    --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    --mono:"SF Mono","JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  a{color:inherit;}

  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:11px;padding:10px 18px;
    background:rgba(245,239,227,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .back{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    display:flex;align-items:center;justify-content:center;text-decoration:none;}
  .back svg{width:16px;height:16px;stroke:var(--ink);}
  .brand h1{margin:0;font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.02em;}
  .brand h1 i{font-style:normal;font-weight:400;color:var(--faint);font-size:12.5px;font-family:var(--sans);letter-spacing:0;}
  .brand p{margin:1px 0 0;font-size:12px;color:var(--muted);}

  .wrap{max-width:1180px;margin:0 auto;padding:18px 18px 44px;}

  /* 统计条 */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;}
  @media (min-width:760px){.stats{grid-template-columns:repeat(4,1fr);}}
  .stats div{background:var(--card);padding:12px 14px;}
  .stats b{display:block;font-family:var(--mono);font-size:20px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;}
  .stats span{font-size:11.5px;color:var(--muted);}

  /* 检索 */
  .searchbar{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:0 15px;height:44px;margin-bottom:10px;}
  .searchbar:focus-within{border-color:var(--seal);box-shadow:0 0 0 3px rgba(168,58,44,.08);}
  .searchbar svg{width:16px;height:16px;stroke:var(--faint);flex:0 0 auto;}
  .searchbar input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:var(--sans);font-size:15px;color:var(--ink);}
  .searchbar input::placeholder{color:var(--faint);}
  .clear{border:0;background:transparent;color:var(--faint);font-size:12px;cursor:pointer;padding:4px;}

  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);
    font-family:var(--sans);font-size:12.5px;padding:6px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;}
  .chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fbf7ef;}

  /* 时间尺 */
  .ruler-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px 8px;margin-bottom:16px;}
  .ruler-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;gap:8px;}
  .ruler-head h2{margin:0;font-family:var(--serif);font-size:14.5px;font-weight:700;white-space:nowrap;}
  .ruler-head span{font-size:11.5px;color:var(--faint);}
  .ruler-scroll{overflow-x:auto;padding-bottom:6px;}
  .ruler-track{position:relative;min-width:1150px;}
  .seg{position:absolute;height:16px;border-radius:3px;cursor:pointer;overflow:hidden;opacity:.92;transition:opacity .15s, transform .15s;}
  .sl-out{position:absolute;font-family:var(--serif);font-size:10px;line-height:17px;font-weight:600;color:#5f594f;white-space:nowrap;pointer-events:none;}
  .tickline{position:absolute;top:0;bottom:20px;width:1px;background:rgba(31,28,25,.06);}
  .seg .sl{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:10px;line-height:1;color:#f7f2e7;white-space:nowrap;letter-spacing:.2px;}
  .seg:hover,.seg.on{opacity:1;transform:translateY(-1px);box-shadow:0 2px 0 rgba(29,28,25,.18);}
  .seg-label{position:absolute;font-size:10.5px;color:var(--muted);white-space:nowrap;transform:translateX(-50%);}
  .ruler-axis{position:absolute;bottom:0;left:0;right:0;border-top:1px solid var(--line);}
  .tick{position:absolute;bottom:0;font-family:var(--mono);font-size:10px;color:var(--faint);transform:translateX(-50%);}
  .tick::before{content:"";position:absolute;left:50%;bottom:14px;width:1px;height:4px;background:var(--line);}
  .swipe-hint{display:inline;}
  @media (min-width:760px){.swipe-hint{display:none;}}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;font-size:11px;color:var(--muted);}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;}

  /* 列表 */
  .list-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px;}
  .list-head h2{margin:0;font-family:var(--serif);font-size:15px;font-weight:700;}
  .list-head span{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;}

  .dyn{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:9px;overflow:hidden;}
  .dyn.open{border-color:#d3c3a8;box-shadow:0 1px 0 rgba(29,28,25,.04);}
  .dyn-btn{display:block;width:100%;text-align:left;border:0;background:transparent;padding:13px 15px;cursor:pointer;font-family:var(--sans);}
  .dyn-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;}
  .dyn-name{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.01em;}
  .dyn-years{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .badge{font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--paper-2);color:var(--muted);white-space:nowrap;}
  .badge.seal{background:var(--seal-soft);color:var(--seal);}
  .dyn-meta{margin-top:5px;display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);}
  .dyn-meta b{font-weight:500;color:var(--ink);}
  .dyn-desc{margin-top:6px;font-size:12.5px;line-height:1.65;color:#4a463e;}

  .dyn-body{display:none;padding:0 15px 14px;}
  .dyn.open .dyn-body{display:block;}
  .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin:9px 0 10px;padding-top:10px;border-top:1px dashed var(--line);}
  @media (min-width:760px){.kv{grid-template-columns:repeat(3,minmax(0,1fr));}}
  .kv div{font-size:12.5px;}
  .kv span{display:block;font-size:11px;color:var(--faint);margin-bottom:1px;}
  .states-head{display:flex;align-items:baseline;gap:8px;margin:13px 0 7px;padding-top:11px;border-top:1px solid rgba(31,28,25,.09);font-size:12px;color:#6d675d;}
  .states-head b{font-family:var(--serif);font-size:13.5px;font-weight:600;color:#1f1c19;}
  .state-grid{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr;gap:0;}
  @media (min-width:760px){.state-grid{grid-template-columns:1fr 1fr;gap:0 26px;}}
  @media (min-width:1180px){.state-grid{grid-template-columns:repeat(2,1fr);}}
  .state-grid li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:6px 0;border-bottom:1px dashed rgba(31,28,25,.11);}
  .state-grid li:last-child,.state-grid li:nth-last-child(2){border-bottom:none;}
  .sn{font-family:var(--serif);font-size:13px;color:#1f1c19;white-space:nowrap;}
  .sy{font-family:var(--mono);font-size:11.5px;color:#5f594f;font-variant-numeric:tabular-nums;white-space:nowrap;align-self:center;}
  .sx{grid-column:1 / -1;font-size:11.5px;color:#8a8578;}
  .sx em{font-style:normal;color:#a83a2c;}
  .rulers{margin-top:13px;padding-top:11px;border-top:1px solid rgba(31,28,25,.09);}
  .rulers-head{display:flex;align-items:baseline;gap:8px;margin-bottom:7px;font-size:12px;color:#6d675d;letter-spacing:.02em;}
  .rulers-head b{font-family:var(--serif);font-size:13.5px;font-weight:600;color:#1f1c19;}
  .ruler-tl{margin:0;padding:0;list-style:none;}
  .ruler-tl li{display:grid;grid-template-columns:112px 16px minmax(0,1fr);align-items:start;min-width:0;}
  .rt-year{grid-column:1;font-family:var(--mono);font-size:10.5px;color:#5f594f;font-variant-numeric:tabular-nums;text-align:right;padding:3px 8px 0 0;white-space:normal;line-height:1.5;letter-spacing:0;}
  .rt-node{grid-column:2;position:relative;align-self:stretch;min-height:26px;}
  .rt-node:before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(31,28,25,.16);transform:translateX(-50%);}
  .rt-node:after{content:'';position:absolute;left:50%;top:9px;width:7px;height:7px;border-radius:50%;background:var(--seal);transform:translate(-50%,-50%);}
  .ruler-tl li:first-child .rt-node:before{top:9px;}
  .ruler-tl li:last-child .rt-node:before{bottom:auto;height:9px;}
  .rt-body{grid-column:3;padding:0 0 13px 6px;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;}
  .rt-name{font-family:var(--serif);font-size:13px;color:#1f1c19;line-height:1.35;}
  .rt-era{font-style:normal;font-size:11.5px;color:var(--seal);letter-spacing:.01em;}
  .rt-name{cursor:pointer;border-bottom:1px dotted rgba(168,58,44,.35);}
  .rt-name:hover{color:var(--seal);border-bottom-color:var(--seal);}
  .emp-mask{position:fixed;inset:0;background:rgba(31,28,25,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:70;}
  .emp-mask[hidden]{display:none;}
  .emp-card{box-sizing:border-box;background:var(--paper);width:100%;max-width:540px;max-height:84vh;overflow:auto;position:relative;padding:22px 24px 20px;border:1px solid rgba(31,28,25,.16);border-top:3px solid var(--seal);box-shadow:0 18px 40px rgba(31,28,25,.18);}
  .emp-close{position:absolute;top:8px;right:10px;width:30px;height:30px;border:0;background:none;font-size:19px;line-height:1;color:#8a8578;cursor:pointer;}
  .emp-close:hover{color:var(--seal);}
  .emp-title{font-family:var(--serif);font-size:19px;font-weight:600;color:#1f1c19;margin:0 0 3px;letter-spacing:.5px;}
  .emp-sub{font-size:12px;color:#6d675d;}
  .emp-kv{display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:9px 20px;margin:13px 0 12px;padding:11px 0;border-top:1px dashed rgba(31,28,25,.18);border-bottom:1px dashed rgba(31,28,25,.18);font-size:12.5px;color:#1f1c19;}
  .emp-kv label{display:block;font-size:11px;color:#8a8578;margin-bottom:2px;}
  .emp-kv .wide{grid-column:1/-1;}
  .emp-kv .kid-grid{display:block;font-size:12.5px;line-height:1.65;}
  .emp-kv .kid-row{display:flex;align-items:baseline;flex-wrap:wrap;}
  .emp-kv .kid-row span{min-width:0;}
  .emp-kv .kid-sum{margin-top:5px;font-size:11.5px;color:#6d675d;}
  .emp-kv .kid-grid .sep{font-style:normal;font-size:10px;color:#9a948a;margin:0 3px;}
  .emp-text{font-size:13px;line-height:1.9;color:#3d382f;}
  @media (max-width:520px){
    .emp-kv .kid-grid{font-size:12px;} .emp-kv{grid-template-columns:1fr;gap:8px;} .emp-card{padding:18px 16px 16px;} .emp-title{font-size:17px;} }
  .emp-foot{margin-top:12px;font-size:11.5px;color:#8a8578;}
  .rt-queen{font-size:11px;color:#7c7263;padding-left:7px;border-left:1px solid rgba(168,58,44,.35);}
  .rt-note{font-size:11.5px;color:#8a8578;}
  @media (max-width:520px){
    .ruler-tl li{grid-template-columns:96px 14px minmax(0,1fr);}
    .rt-year{font-size:9.5px;padding-right:5px;}
    .rt-body{padding-bottom:11px;}
  }
  .refs{margin-top:13px;padding-top:11px;border-top:1px solid rgba(31,28,25,.09);display:grid;grid-template-columns:1fr;gap:12px;}
  .ref-head{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;font-size:12px;color:#6d675d;}
  .ref-head b{font-family:var(--serif);font-size:13.5px;font-weight:600;color:#1f1c19;}
  .ref-list{margin:0;padding:0;list-style:none;}
  .ref-list li{border-left:2px solid rgba(168,58,44,.42);padding:3px 0 3px 10px;font-size:12px;line-height:1.6;color:#463f35;}
  .ref-list .rk{font-family:var(--serif);font-weight:600;color:#1f1c19;}
  @media (min-width:900px){ .refs{grid-template-columns:1fr 1fr;gap:0 26px;} }
  .grp{margin-top:13px;padding-top:11px;border-top:1px solid rgba(31,28,25,.09);}
  .grp-head{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;font-size:12px;color:#6d675d;}
  .grp-head b{font-family:var(--serif);font-size:13.5px;font-weight:600;color:#1f1c19;}
  .grp-row{display:grid;grid-template-columns:1fr auto;gap:0 10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px dashed rgba(31,28,25,.11);padding:7px 0;cursor:pointer;font:inherit;color:inherit;}
  .grp-row:last-child{border-bottom:none;}
  .grp-row:hover .gn{color:var(--seal);}
  .gn{font-family:var(--serif);font-size:13px;color:#1f1c19;transition:color .15s;}
  .gy{font-family:var(--mono);font-size:11.5px;color:#5f594f;white-space:nowrap;}
  .gm{font-size:11.5px;color:#8a8578;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sub{border-left:2px solid var(--seal);padding-left:10px;margin:10px 0 0;}
  .sub-btn{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:0 8px;width:100%;background:none;border:0;padding:6px 0;cursor:pointer;font:inherit;color:inherit;text-align:left;}
  .sub-name{font-family:var(--serif);font-size:13px;color:#1f1c19;}
  .sub-btn[aria-expanded="true"] .sub-name{color:var(--seal);}
  .sub-body{padding-bottom:8px;}
  .sub-kv{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;font-size:11.5px;color:#5f594f;margin-bottom:8px;}
  .sub-kv span{color:#8a8578;margin-right:4px;}
  @media (min-width:760px){.sub-kv{grid-template-columns:1fr 1fr 1fr;}}
  .rnote i{font-style:normal;color:#b9b3a6;}

@media (max-width:600px){  }
  .events{margin:0;padding:0;list-style:none;}
  .events li{position:relative;padding-left:13px;font-size:12.5px;line-height:1.75;color:#3f3b34;}
  .events li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--seal);opacity:.55;}

  .empty{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:34px 18px;text-align:center;color:var(--muted);font-size:13px;}
  .empty p{margin:0 0 8px;}
  .empty button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--seal);cursor:pointer;font-family:var(--sans);}

  .foot{margin-top:22px;font-size:11.5px;line-height:1.8;color:var(--faint);}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);background:var(--ink);color:#fbf7ef;
    font-size:12.5px;padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap;}
  .toast.on{opacity:1;transform:translate(-50%,0);}

  @media (max-width:600px){
    .topbar{padding:8px 12px;}
    .brand h1 i{display:none;}
    .wrap{padding:13px 12px 34px;}
    .dyn-name{font-size:16px;}
  }
</style>
</head>
<body>
<div class="emp-mask" id="empMask" hidden>
  <div class="emp-card" role="dialog" aria-modal="true" aria-labelledby="empTitle">
    <button class="emp-close" id="empClose" type="button" aria-label="关闭">×</button>
    <div id="empBody"></div>
  </div>
</div>


<header class="topbar">
  <a class="back" href="../首页/首页.html" aria-label="返回首页" title="返回首页">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <div class="brand">
    <h1>中国历史朝代 <i>· Chinese Dynasties</i></h1>
    <p>从三皇五帝到清 · 起止年份 / 都城 / 帝王世系</p>
  </div>
</header>

<div class="wrap">
  <div class="stats">
    <div><b id="statCount">—</b><span>收录朝代与政权</span></div>
    <div><b id="statSpan">—</b><span>时间跨度（年）</span></div>
    <div><b id="statLong">—</b><span>存续最久的政权</span></div>
    <div><b id="statSplit">—</b><span>并立 / 分裂时期</span></div>
  </div>

  <div class="searchbar">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
    <input id="q" type="search" placeholder="搜索朝代、都城、帝王、事件，如「唐」「长安」「李世民」" autocomplete="off">
    <button class="clear" type="button" id="qClear" hidden>清空</button>
  </div>

  <div class="chips" id="chips" role="group" aria-label="时期筛选"></div>

  <section class="ruler-card">
    <div class="ruler-head">
      <h2>朝代时间尺</h2>
      <span>宽度与年数成正比 · 并立者分层 · 选时期可放大<span class="swipe-hint"> · 左右滑动</span></span>
    </div>
    <div class="ruler-scroll">
      <div class="ruler-track" id="track"></div>
    </div>
    <div class="legend" id="legend"></div>
  </section>

  <div class="list-head">
    <h2>朝代一览</h2>
    <span id="listCount">—</span>
  </div>
  <div id="list"></div>
  <div id="empty" class="empty" hidden>
    <p>没有匹配的朝代。</p>
    <button type="button" id="resetAll">查看全部朝代</button>
  </div>

  <p class="foot">年代依据通行史学分期整理，三皇五帝与夏、商及周初年代为约数或传说，不同研究结论存在差异；分裂时期的起止以主要政权为准，仅作查询参考。</p>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
/* 朝代数据：start/end 为公元纪年，负数表示公元前 */
var DYNASTIES = [
{ name:'三皇五帝', era:'先秦', start:-2852, end:-2070, cap:'迁徙不定', founder:'黄帝（传说）', last:'舜', grp:'三皇五帝', grpLabel:'上古帝王',
  nat:'华夏族', tag:'传说时代', desc:'燧人、伏羲、神农三皇与黄帝、颛顼、帝喾、尧、舜五帝的传说时代，尧舜禅让，为后世所追述的上古谱系，年代皆为古籍推演。',
  events:['伏羲画八卦、结网罟，教民渔猎','神农尝百草、教耕稼','黄帝败炎帝、诛蚩尤，部落联盟成形','尧禅位于舜，舜禅位于禹']},

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function yearText(y){
  if (y < 0) return '前 ' + Math.abs(y) + ' 年';
  return y + ' 年';
}
function rangeText(d){
  return yearText(d.start) + ' — ' + yearText(d.end);
}
function years(d){ return d.end - d.start; }
function match(d){
  if (state.era !== '全部' && d.era !== state.era) return false;
  if (!state.q) return true;
  var q = state.q.trim().toLowerCase();
  if (!q) return true;
  var rs = RULERS[d.name] || [];
  var hay = [d.name, d.era, d.cap, d.founder, d.last, d.desc, d.tag, d.nat || '',
    d.events.join(' '), rs.map(function(r){ return r[0] + ' ' + r[3] + ' ' + r[4]; }).join(' '),
    String(d.start), String(Math.abs(d.start)), String(d.end)].join(' ').toLowerCase();
  if (hay.indexOf(q) >= 0) return true;
  if (d.grp){
    var kids = childrenOf(d);
    for (var i = 0; i < kids.length; i++){ if (matchPlain(kids[i], q)) return true; }
  }
  return false;
}
function matchPlain(d, q){
  if (state.era !== '全部' && d.era !== state.era) return false;
  var rs = RULERS[d.name] || [];
  var hay = [d.name, d.era, d.cap, d.founder, d.last, d.desc, d.tag, d.nat || '',
    d.events.join(' '), rs.map(function(r){ return r[0] + ' ' + r[3] + ' ' + r[4]; }).join(' '),
    (REFS[d.name] ? REFS[d.name].war.join(' ') + ' ' + REFS[d.name].tale.join(' ') : ''),
    String(d.start), String(Math.abs(d.start)), String(d.end)].join(' ').toLowerCase();
  return hay.indexOf(q) >= 0;
}

function paintStats(){
  var main = DYNASTIES.filter(function(d){ return !d.child; });
  document.getElementById('statCount').textContent = main.length;
  var min = Math.min.apply(null, main.map(function(d){ return d.start; }));
  var max = Math.max.apply(null, main.map(function(d){ return d.end; }));
  document.getElementById('statSpan').textContent = (max - min).toLocaleString('zh-CN');
  var longest = main.filter(function(d){ return d.tag !== '传说时代'; }).sort(function(a,b){ return years(b) - years(a); })[0];
  document.getElementById('statLong').style.fontSize = '15px';
  document.getElementById('statLong').textContent = longest.name + '（' + years(longest) + ' 年）';
  var splits = main.filter(function(d){ return d.split; }).length;
  document.getElementById('statSplit').textContent = splits + ' 个';
}

/* ---------- 时间尺 ---------- */
function paintRuler(){
  var track = document.getElementById('track');
  var isAll = state.era === '全部';
  var pool = (isAll ? DYNASTIES : DYNASTIES.filter(function(d){ return d.era === state.era; })).filter(function(d){ return !d.child; });
  if (!pool.length){ pool = DYNASTIES; }
  var min = Math.min.apply(null, pool.map(function(d){ return d.start; }));
  var max = Math.max.apply(null, pool.map(function(d){ return d.end; }));
  var total = Math.max(1, max - min);
  var TRACK_PX = 1150;
  var laneH = 24, barH = 17;
  var maxLane = isAll ? 2 : 99;   // 总览最多三层，选时期后按需展开

  // 分层：按起始年放进最早空出来的泳道，顺序相接的朝代自然共用第一层
  var lanes = [];
  var laneOf = {};
  pool.slice().sort(function(a, b){
    return a.start - b.start || years(a) - years(b);
  }).forEach(function(d){
    var k = 0;
    for (; k < lanes.length; k++){ if (lanes[k] <= d.start){ break; } }
    if (k > maxLane){ k = maxLane; }
    if (k >= lanes.length){ lanes.push(d.end); } else { lanes[k] = Math.max(lanes[k], d.end); }
    laneOf[d.name] = k;
  });
  var bodyH = Math.max(1, lanes.length) * laneH;
  track.style.height = (bodyH + 32) + 'px';

  var html = '';
  pool.forEach(function(d){
    var i = DYNASTIES.indexOf(d);
    var left = (d.start - min) / total * 100;
    var width = Math.max(0.5, years(d) / total * 100);
    var color = ERA_COLOR[d.era] || '#6c665c';
    html += '<div class="seg" data-i="' + i + '" data-n="' + esc(d.name) + '" title="' + esc(d.name + ' ' + rangeText(d)) + '"'
      + ' style="left:' + left.toFixed(3) + '%;width:' + width.toFixed(3) + '%;top:' + (2 + laneOf[d.name] * laneH) + 'px;height:' + barH + 'px;background:' + color
      + (d.split ? ';opacity:.74' : '') + '"></div>';
  });

  // 年代刻度：按时段跨度自动换步长
  var ticks = '';
  var step = total > 2000 ? 500 : total > 800 ? 200 : total > 300 ? 100 : 50;
  var first = Math.ceil(min / step) * step;
  for (var y = first; y <= max; y += step){
    var pos = (y - min) / total * 100;
    if (pos < 1.5 || pos > 98.5){ continue; }
    ticks += '<div class="tick" style="left:' + pos.toFixed(2) + '%">' + (y < 0 ? '前' + Math.abs(y) : y) + '</div>';
  }
  track.innerHTML = html + '<div class="ruler-axis"></div>' + ticks;

  // 刻度竖线：给每个刻度一条淡竖线，便于对齐读年
  track.querySelectorAll('.tick').forEach(function(t){
    var line = document.createElement('div');
    line.className = 'tickline';
    line.style.left = t.style.left;
    track.insertBefore(line, track.firstChild);
  });

  // 二次校正：条带内放得下就写全名/短名，放不下就放到条带右侧；都挤不下则只留悬停提示
  var meas = document.createElement('canvas').getContext('2d');
  meas.font = '600 10.5px "Songti SC", "Noto Serif SC", serif';
  var pRuler = track;
  var segs = [].slice.call(track.querySelectorAll('.seg')).map(function(seg){
    var r = seg.getBoundingClientRect();
    return { seg: seg, left: r.left, right: r.right, w: r.width };
  });
  segs.forEach(function(o, idx){
    var name = o.seg.dataset.n;
    var short = name.indexOf('·') >= 0 ? name.split('·').pop() : name;
    var wName = meas.measureText(name).width + 14;
    var wShort = meas.measureText(short).width + 12;
    var txt = '', inside = false;
    if (o.w >= wName){ txt = name; inside = true; }
    else if (o.w >= wShort){ txt = short; inside = true; }
    if (!txt) return;
    var sp = document.createElement('span');
    sp.textContent = txt;
    if (inside){
      sp.className = 'sl';
      o.seg.appendChild(sp);
      return;
    }
    sp.className = 'sl sl-out';
    var room = (idx + 1 < segs.length) ? segs[idx + 1].left - o.right : (track.clientWidth - o.right);
    if (room < meas.measureText(txt).width + 8) return;
    sp.style.left = (o.right + 5) + 'px';
    sp.style.top = o.seg.style.top;
    pRuler.appendChild(sp);
  });  var legend = document.getElementById('legend');
  legend.innerHTML = ERAS.filter(function(e){ return e !== '全部'; }).map(function(e){
    return '<span><i style="background:' + ERA_COLOR[e] + '"></i>' + e + '</span>';
  }).join('');

  track.querySelectorAll('.seg').forEach(function(seg){
    seg.addEventListener('click', function(){
      var d = DYNASTIES[parseInt(seg.dataset.i, 10)];
      if (!d){ return; }
      state.q = '';
      document.getElementById('q').value = '';
      document.getElementById('qClear').hidden = true;
      if (state.era !== '全部' && state.era !== d.era){ state.era = '全部'; paintChips(); paintRuler(); }
      expanded = {};
      expanded[d.name] = true;
      paintList();
      var card = document.querySelector('[data-name="' + d.name + '"]');
      if (card){
        card.scrollIntoView({ behavior:'smooth', block:'center' });
        toast('已定位到 ' + d.name);
      }
    });
  });
}

/* ---------- 筛选 chips ---------- */
function paintChips(){
  document.getElementById('chips').innerHTML = ERAS.map(function(e){
    return '<button type="button" data-era="' + e + '" aria-pressed="' + (state.era === e) + '">' + e + '</button>';
  }).join('');
  document.querySelectorAll('#chips button').forEach(function(btn){
    btn.addEventListener('click', function(){
      state.era = btn.dataset.era;
      paintChips();
      paintRuler();
      paintList();
    });
  });
}

/* ---------- 帝王列表 ---------- */
function reignText(y1, y2){
  function y(v){ return v < 0 ? '前 ' + Math.abs(v) : '' + v; }
  if (y1 === y2) return y(y1) + ' 年';
  return y(y1) + ' — ' + y(y2);
}
function reignTL(y1, y2){
  function y(v){ return (v < 0 ? '前' + Math.abs(v) : '' + v) + '年'; }
  return y1 === y2 ? y(y1) : y(y1) + '—' + y(y2);
}
function isChildOf(x, d){
  if (!x.child) return false;
  if (x.par) return x.par === d.grp;
  return x.name.indexOf(d.grp + '·') === 0;
}
function childrenOf(d){
  return DYNASTIES.filter(function(x){ return isChildOf(x, d); });
}

function groupHTML(d){
  if (!d.grp) return '';
  var members = childrenOf(d);
  if (!members.length) return '';
  var q = (state.q || '').trim().toLowerCase();
  var grpHit = !!(d.grp && q && d.grp.toLowerCase().indexOf(q) >= 0);
  var rows = members.map(function(m){
    var short = m.name.split('·').pop();
    var open = (subOpen[m.name] || (q && !grpHit && matchPlain(m, q))) ? true : false;
    var body = open
      ? '<div class="sub-body">'
        + '<div class="sub-kv">'
        + '<div><span>起止</span>' + rangeText(m) + '</div>'
        + '<div><span>都城</span>' + esc(m.cap) + '</div>'
        + '<div><span>建立民族</span>' + esc(m.nat || '—') + '</div>'
        + (m.person ? '' : '<div><span>开国君主</span>' + esc(m.founder) + '</div>')
        + (m.person ? '' : '<div><span>末代君主</span>' + esc(m.last) + '</div>')
        + '<div><span>存续</span>' + years(m) + ' 年</div>'
        + '</div>'
        + '<div class="dyn-desc">' + esc(m.desc) + '</div>'
        + rulersHTML(m)
        + '<ul class="events">' + m.events.map(function(e){ return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>'
        + '</div>'
      : '';
    var pre = m.name.indexOf('·') >= 0 ? m.name.split('·')[0] : '';
    var preTxt = (pre && pre !== d.grp) ? pre + ' · ' : '';
    return '<div class="sub">'
      + '<button type="button" class="sub-btn" data-sub="' + esc(m.name) + '" aria-expanded="' + (open ? 'true' : 'false') + '">'
      + '<span class="sub-name">' + esc(short) + '</span>'
      + '<span class="gm">' + esc(preTxt) + esc(m.cap) + (m.person ? ' · ' + esc(m.founder) : ' · ' + esc(m.founder)) + (RULERS[m.name] ? ' · ' + RULERS[m.name].length + ' 帝' : '') + '</span>'
      + '<span class="gy">' + rangeText(m) + '</span>'
      + '</button>' + body + '</div>';
  }).join('');
  return '<div class="grp"><div class="grp-head"><b>' + esc(d.grpLabel || d.grp + '政权') + '</b><span>' + members.length + ' 个 · 点击展开</span></div>'
    + rows + '</div>';
}

function refsHTML(d){
  var r = REFS[d.name];
  if (!r) return '';
  function lst(arr){
    return arr.map(function(t){
      var parts = t.split(' · ');
      return '<li><span class="rk">' + esc(parts[0]) + '</span>'
        + (parts.length > 1 ? ' · ' + esc(parts.slice(1).join(' · ')) : '') + '</li>';
    }).join('');
  }
  return '<div class="refs">'
    + '<div class="ref-col"><div class="ref-head"><b>经典战争</b><span>' + r.war.length + ' 场</span></div>'
    + '<ul class="ref-list">' + lst(r.war) + '</ul></div>'
    + '<div class="ref-col"><div class="ref-head"><b>典故成语</b><span>' + r.tale.length + ' 则</span></div>'
    + '<ul class="ref-list">' + lst(r.tale) + '</ul></div>'
    + '</div>';
}

function rulersHTML(d){
  if (d.grp) return '';
  var rs = RULERS[d.name];
  if (!rs || !rs.length) return '';
  var rows = rs.map(function(r){
    return '<li>'
      + '<span class="rt-year">' + reignTL(r[1], r[2]) + '</span>'
      + '<span class="rt-node" aria-hidden="true"></span>'
      + '<span class="rt-body">'
        + '<span class="rt-name" data-d="' + esc(d.name) + '" data-r="' + esc(r[0]) + '">' + esc(r[0]) + '</span>'
        + (r[4] ? '<em class="rt-era">' + esc(r[4]) + '</em>' : '')
        + (r[3] ? '<span class="rt-note">' + esc(r[3]) + '</span>' : '')
        + (QUEEN[r[0]] ? '<span class="rt-queen">后 · ' + esc(QUEEN[r[0]]) + '</span>' : '')
      + '</span>'
      + '</li>';
  }).join('');
  return '<div class="rulers"><div class="rulers-head"><b>帝王列表</b><span>主要 ' + rs.length + ' 位 · 自上而下为在位先后</span></div>'
    + '<ol class="ruler-tl">' + rows + '</ol></div>';
}

/* ---------- 帝王弹层 ---------- */
function empHTML(dynName, rName){
  var rs = RULERS[dynName] || [];
  var idx = -1, row = null;
  rs.forEach(function(r, i){ if (r[0] === rName) { idx = i; row = r; } });
  if (!row) return '';
  var d = DYNASTIES.filter(function(x){ return x.name === dynName; })[0] || {};
  var span = row[2] - row[1];
  var cd = ['零','一','二','三','四','五','六','七','八','九'];
  var cn = function (n) {
    if (n < 10) return cd[n];
    if (n < 20) return '十' + (n % 10 ? cd[n % 10] : '');
    return cd[Math.floor(n / 10)] + '十' + (n % 10 ? cd[n % 10] : '');
  };
  var ord = (idx + 1 === rs.length) ? '最后一位' : '第' + cn(idx + 1) + '位';
  var intro = INTRO[rName];
  if (!intro) {
    intro = esc(rName) + ' 为' + esc(dynName || '') + '第' + cn(idx + 1) + '位君主，在位 ' + span + ' 年'
      + (row[4] ? '，年号 ' + esc(row[4]) : '') + (row[3] ? '；' + esc(row[3]) : '') + '。';
  }
  var facts = [];
  if (row[4]) facts.push('<div><label>年号</label>' + esc(row[4]) + '</div>');
  if (LIFESPAN[rName]) facts.push('<div><label>生卒</label>' + esc(LIFESPAN[rName]) + '</div>');
  var ex = EX[rName] || {};
  if (ex.h) facts.push('<div><label>号</label>' + esc(ex.h) + '</div>');
  if (ex.sh) facts.push('<div><label>谥号</label>' + esc(ex.sh) + '</div>');
  if (ex.m) facts.push('<div><label>庙号</label>' + esc(ex.m) + '</div>');
  if (ex.f) facts.push('<div><label>封号</label>' + esc(ex.f) + '</div>');
  var nat = ex.nat || d.nat || '';
  if (nat) facts.push('<div><label>民族</label>' + esc(nat) + '</div>');
  facts.push('<div><label>性别</label>' + (rName === '武则天' ? '女' : '男') + '</div>');
  if (ex.b) facts.push('<div><label>生于</label>' + esc(ex.b) + '</div>');
  if (ex.d) facts.push('<div><label>卒于</label>' + esc(ex.d) + '</div>');
  if (ex.t) facts.push('<div><label>陵墓</label>' + esc(ex.t) + '</div>');
  facts.push('<div><label>在位</label>' + reignTL(row[1], row[2]) + '，共 ' + span + ' 年</div>');
  if (ex.an) facts.push('<div class="wide"><label>轶事典故</label>' + esc(ex.an) + '</div>');
  var cw = CROWN[rName];
  var qName = cw ? cw[0] : (QUEEN[rName] || '');
  if (qName) facts.push('<div><label>皇后</label>' + esc(qName) + '</div>');
  var mom = MOTHER[rName] || '';
  if (!mom) {
    var pn = rName.indexOf(' ') > 0 ? rName.split(' ')[1] : rName;
    for (var ck in CHILD) {
      var cv = CHILD[ck], ci = cv.indexOf(pn + '（母');
      if (ci >= 0) {
        var ce = cv.indexOf('）', ci);
        if (ce > ci) { mom = cv.slice(ci + pn.length + 2, ce); }
        break;
      }
    }
  }
  if (mom) facts.push('<div><label>生母</label>' + esc(mom) + '</div>');
  var kids = CHILD[rName] || (cw ? cw[1] : '');
  if (kids) {
    var ksum = '';
    var ix = kids.indexOf('，共');
    if (ix >= 0) { ksum = kids.slice(ix + 1); kids = kids.slice(0, ix); }
    var arr = kids.split('、');
    var kh = '';
    for (var ki = 0; ki < arr.length; ki += 2) {
      var b = arr[ki + 1];
      kh += '<div class="kid-row"><span>' + esc(arr[ki]) + '</span>'
          + (b !== undefined ? '<em class="sep">｜</em><span>' + esc(b) + '</span>' : '')
          + '</div>';
    }
    facts.push('<div class="wide"><label>子嗣</label><div class="kid-grid">' + kh + '</div>' + (ksum ? '<div class="kid-sum">' + esc(ksum) + '</div>' : '') + '</div>');
  }
  else if (QUEEN[rName]) facts.push('<div><label>子嗣</label>史载不详</div>');
  if (row[3]) facts.push('<div><label>史事</label>' + esc(row[3]) + '</div>');
  if (d.events && d.events.length) facts.push('<div><label>本朝要事</label>' + esc(d.events[0]) + '</div>');
  return '<h3 class="emp-title">' + esc(rName) + '</h3>'
    + '<div class="emp-sub">' + esc(dynName) + ' · ' + ord + ' · ' + reignTL(row[1], row[2]) + ' · 在位 ' + span + ' 年</div>'
    + (facts.length ? '<div class="emp-kv">' + facts.join('') + '</div>' : '')
    + '<div class="emp-text">' + intro + '</div>'
    + '<div class="emp-foot">简介据通行史传概述，具体年月以各家年表为参。</div>';
}
var empLastFocus = null;
document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('.rt-name') : null;
  if (!el) return;
  e.preventDefault(); e.stopPropagation();
  empLastFocus = el;
  document.getElementById('empBody').innerHTML = empHTML(el.dataset.d, el.dataset.r);
  document.getElementById('empMask').hidden = false;
  document.getElementById('empClose').focus();
});
function closeEmp(){
  var mask = document.getElementById('empMask');
  if (mask.hidden) return;
  mask.hidden = true;
  if (empLastFocus) empLastFocus.focus();
}
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeEmp(); });
document.getElementById('empClose').addEventListener('click', closeEmp);
document.getElementById('empMask').addEventListener('click', function(e){ if (e.target === this) closeEmp(); });

/* ---------- 列表 ---------- */
function paintList(){
  var rows = DYNASTIES.filter(function(d){ return !d.child; }).filter(match);
  document.getElementById('listCount').textContent = '共 ' + rows.length + ' 个';
  document.getElementById('empty').hidden = rows.length > 0;

  var html = rows.map(function(d){
    var i = DYNASTIES.indexOf(d);
    var open = expanded[d.name] ? ' open' : '';
    return '<article class="dyn' + open + '" data-name="' + esc(d.name) + '" data-i="' + i + '">'
      + '<button class="dyn-btn" type="button" aria-expanded="' + (expanded[d.name] ? 'true' : 'false') + '">'
      + '<div class="dyn-top">'
      + '<span class="dyn-name">' + esc(d.name) + '</span>'
      + '<span class="dyn-years">' + rangeText(d) + '</span>'
      + (d.unify ? '<span class="badge seal">大一统</span>' : '')
      + (d.split ? '<span class="badge">并立 / 分裂</span>' : '')
      + '<span class="badge">' + esc(d.era) + '</span>'
      + '</div>'
      + '<div class="dyn-meta">'
      + '<span>都城 <b>' + esc(d.cap) + '</b></span>'
      + '<span>开国 <b>' + esc(d.founder) + '</b></span>'
      + '<span>民族 <b>' + esc(d.nat || '—') + '</b></span>'
      + '<span>存续 <b>' + years(d) + ' 年</b></span>'
      + '</div>'
      + '<div class="dyn-desc">' + esc(d.desc) + '</div>'
      + '</button>'
      + '<div class="dyn-body">'
      + '<div class="kv">'
      + '<div><span>起止</span>' + rangeText(d) + '</div>'
      + '<div><span>都城</span>' + esc(d.cap) + '</div>'
      + '<div><span>开国君主</span>' + esc(d.founder) + '</div>'
      + '<div><span>末代君主</span>' + esc(d.last) + '</div>'
      + '<div><span>存续年数</span>' + years(d) + ' 年</div>'
      + '<div><span>类型</span>' + esc(d.tag) + '</div>'
      + '<div><span>建立民族</span>' + esc(d.nat || '—') + '</div>'
      + '<div><span>' + (d.grp ? '下属政权' : '帝王数') + '</span>' + (d.grp
        ? childrenOf(d).length + ' 个'
        : ((RULERS[d.name] || []).length ? '主要 ' + (RULERS[d.name] || []).length + ' 位' : '—')) + '</div>'
      + '</div>'
      + groupHTML(d)
      + rulersHTML(d)
      + '<ul class="events">' + d.events.map(function(e){ return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>'
      + refsHTML(d)
      + '</div></article>';
  }).join('');

  document.getElementById('list').innerHTML = html;

  document.querySelectorAll('.sub-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var key = btn.dataset.sub;
      subOpen[key] = !subOpen[key];
      paintList();
    });
  });

  document.querySelectorAll('.dyn-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var art = btn.closest('.dyn');
      var name = art.dataset.name;
      var wasOpen = expanded[name];
      expanded = {};
      if (!wasOpen) expanded[name] = true;
      paintList();
    });
  });
}

/* ---------- 交互 ---------- */
var qTimer;
document.getElementById('q').addEventListener('input', function(){
  var v = this.value;
  document.getElementById('qClear').hidden = !v;
  clearTimeout(qTimer);
  qTimer = setTimeout(function(){
    state.q = v;
    paintList();
  }, 140);
});
document.getElementById('qClear').addEventListener('click', function(){
  document.getElementById('q').value = '';
  this.hidden = true;
  state.q = '';
  paintList();
});
document.getElementById('resetAll').addEventListener('click', function(){
  state.era = '全部'; state.q = '';
  document.getElementById('q').value = '';
  document.getElementById('qClear').hidden = true;
  paintChips(); paintList();
});

var toastTimer;
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 1600);
}

paintStats();
paintChips();
paintRuler();
paintList();
